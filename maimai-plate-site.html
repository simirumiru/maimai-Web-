<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>実績プレート表アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#0a0b12; --panel:#12141f; --panel-2:#171a26; --border:#262a3a;
    --text:#eef0f6; --text-dim:#8890a4; --accent:#7ee787; --radius:12px;
    --font-display:'Orbitron','Noto Sans JP',sans-serif;
    --font-body:'Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;}
  a{color:var(--accent);}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  header.app-header{
    padding:22px clamp(16px,4vw,40px);display:flex;align-items:center;gap:16px;
    border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0d0f18,#0a0b12);
  }
  .logo-mark{width:38px;height:38px;position:relative;flex:none;cursor:pointer;}
  .logo-dot{position:absolute;width:8px;height:8px;border-radius:50%;top:15px;left:15px;animation:pulse 2.4s ease-in-out infinite;}
  .logo-mark .c0{background:#f2f4f8;top:15px;left:15px;animation-delay:0s;}
  .logo-mark .c1{background:#ff4fd8;top:0;left:15px;animation-delay:.15s;}
  .logo-mark .c2{background:#ffb84f;top:5px;left:28px;animation-delay:.3s;}
  .logo-mark .c3{background:#3fd0ff;top:23px;left:28px;animation-delay:.45s;}
  .logo-mark .c4{background:#7ee787;top:30px;left:15px;animation-delay:.6s;}
  .logo-mark .c5{background:#b48cff;top:23px;left:2px;animation-delay:.75s;}
  .logo-mark .c6{background:#ffe14f;top:5px;left:2px;animation-delay:.9s;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.35);opacity:1;}}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em;cursor:pointer;}
  header h1:hover{color:var(--accent);}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--text-dim);}

  #app{padding:20px clamp(16px,4vw,40px) 60px;max-width:1180px;margin:0 auto;}

  .storage-warning{background:#3a2a12;border:1px solid #8a5a1f;color:#ffd399;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:18px;}

  .sync-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px;padding:8px 12px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;font-size:12px;}
  .sync-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .sync-dot.off{background:#5a5f70;}
  .sync-dot.readonly{background:#ffe14f;}
  .sync-dot.admin{background:#7ee787;}
  .sync-text{color:var(--text-dim);flex:1;min-width:0;}
  .readonly-banner{background:#12283a;border:1px solid #1f5a8a;color:#a9d8ff;border-radius:10px;padding:10px 14px;
    font-size:12.5px;margin-bottom:18px;}

  .sync-settings-box{max-width:480px;}
  .sync-settings-box textarea{width:100%;min-height:90px;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;font-family:monospace;}
  .sync-settings-box input[type=text],.sync-settings-box input[type=email],.sync-settings-box input[type=password]{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:8px 10px;font-size:13px;margin-top:4px;}
  .sync-settings-box .field{margin-bottom:12px;}
  .sync-settings-box .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:2px;}
  .sync-settings-box details{margin-top:10px;font-size:12px;color:var(--text-dim);}
  .sync-settings-box summary{cursor:pointer;color:var(--accent);}
  .sync-settings-box ol{padding-left:18px;margin:8px 0;}
  .sync-settings-box li{margin-bottom:4px;}

  .submission-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
  .submission-card .vc-title{font-weight:700;font-size:14px;margin-bottom:6px;}
  .submission-card .vc-meta{font-size:11.5px;color:var(--text-dim);margin-bottom:10px;}
  .star-row{display:flex;gap:2px;font-size:20px;color:#ffe14f;letter-spacing:2px;}
  button.star-btn{background:none;border:none;font-size:22px;color:#ffe14f;padding:0 2px;line-height:1;}

  .btn{border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--accent);}
  .btn:disabled{opacity:.35;cursor:default;}
  .btn:disabled:hover{border-color:var(--border);}
  .btn-primary{background:var(--accent);color:#0a0b12;border-color:var(--accent);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:5px 9px;font-size:11.5px;border-radius:6px;}
  .btn-danger{color:#ff8a8a;}

  /* ---- top bars ---- */
  .view-topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px;}
  .view-topbar h2{margin:0;font-size:17px;flex:1;min-width:160px;}
  .view-topbar .note{font-size:11.5px;color:var(--text-dim);width:100%;margin-top:-6px;}

  /* ---- empty state ---- */
  .empty-state{border:1px dashed var(--border);border-radius:14px;padding:44px 20px;text-align:center;color:var(--text-dim);}
  .empty-state h3{color:var(--text);margin-bottom:8px;}
  .empty-state ol{display:inline-block;text-align:left;font-size:12.5px;margin:14px 0;padding-left:18px;}

  /* ---- list / cards ---- */
  .versions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .version-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s;}
  .version-card:hover{border-color:var(--accent);}
  .vc-swatch{width:100%;height:6px;border-radius:4px;margin-bottom:10px;}
  .vc-title{font-weight:700;font-size:14px;margin-bottom:4px;word-break:break-word;}
  .vc-meta{font-size:11.5px;color:var(--text-dim);margin-bottom:10px;}
  .vc-meta-strong{color:#c9cfdd;}
  .vc-thumbs{display:flex;gap:4px;margin-bottom:10px;min-height:28px;flex-wrap:wrap;}
  .vc-thumb{position:relative;width:26px;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--border);flex:none;}
  .vc-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .vc-badges{font-size:11px;color:var(--text-dim);margin-bottom:10px;}
  .vc-actions{display:flex;flex-wrap:wrap;gap:6px;}

  /* ---- cards (editor) ---- */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 20px;margin-bottom:16px;}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--accent);letter-spacing:.03em;display:flex;align-items:center;gap:8px;}
  .card h2 .hint{font-size:11px;color:var(--text-dim);font-weight:400;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px;}
  .field input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13.5px;}
  input[type=number]{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13.5px;width:100px;}
  .auto-calc-box{background:var(--panel-2);border:1px dashed var(--border);border-radius:10px;padding:12px;margin-bottom:14px;}
  .auto-calc-box .title{font-size:12px;color:var(--text-dim);margin-bottom:8px;}
  .auto-calc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .auto-calc-caption{margin-top:8px;font-size:11.5px;color:var(--text-dim);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row-color{display:flex;align-items:center;gap:10px;}
  input[type=color]{width:38px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);padding:2px;flex:none;}

  .level-block{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;}
  .level-block.is-level-hidden{opacity:.5;border-style:dashed;}
  .btn-hidden-on{background:#5a5f70;border-color:#5a5f70;color:#fff;}
  .level-block-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .level-block-head input[type=text]{width:70px;flex:none;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:700;}
  .level-block-head .spacer{flex:1;}
  .thumb-grid{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;}
  .thumb-item{display:flex;flex-direction:column;gap:4px;width:56px;}
  .thumb{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb.is-hidden img{opacity:.3;}
  .thumb button{position:absolute;top:0;right:0;width:18px;height:18px;line-height:18px;background:rgba(10,11,18,.85);color:#ff8a8a;border:none;font-size:11px;padding:0;border-radius:0 0 0 6px;}
  .thumb-controls{display:flex;gap:4px;}
  .tbtn{flex:1;height:22px;min-width:0;border-radius:5px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);font-size:11px;padding:0;}
  .tbtn.active-slash{background:#ff5c5c;border-color:#ff5c5c;color:#fff;}
  .tbtn.active-hide{background:#5a5f70;border-color:#5a5f70;color:#fff;}
  .slash-overlay{position:absolute;left:-15%;top:46%;width:130%;height:16%;background:#ff2d2d;transform:rotate(-38deg);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.35);}

  .badge-thumb-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .badge-thumb{position:relative;width:150px;height:42px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--panel);}
  .badge-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .badge-thumb button{position:absolute;top:0;right:0;width:18px;height:18px;line-height:18px;background:rgba(10,11,18,.85);color:#ff8a8a;border:none;font-size:11px;padding:0;border-radius:0 0 0 6px;}

  .edit-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start;}
  @media (max-width:920px){.edit-grid{grid-template-columns:1fr;}}
  .edit-preview-col{position:sticky;top:16px;}

  /* ---- preview (rendered table itself) ---- */
  #previewCard{background:#0d0f16;border:1px solid var(--border);border-radius:14px;padding:clamp(18px,3vw,32px);}
  .pv-title{font-family:var(--font-display);font-size:clamp(18px,2.4vw,24px);font-weight:800;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:2px;}
  .pv-info-line{font-size:13.5px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:2px;align-items:baseline;}
  .pv-info-line .label{color:var(--text-dim);margin-right:2px;}
  .pv-info-line .amt{color:var(--text);margin:0 4px;}
  .pv-divider{height:1px;background:var(--border);margin:16px 0;}
  .pv-exclusion{color:var(--text-dim);font-size:12px;margin-left:4px;}
  .pv-subtitle{font-size:13px;margin:2px 0 12px;}

  /* ---- Jewelフレーム表 ---- */
  .jewel-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;margin-top:8px;}
  @media (max-width:760px){ .jewel-grid{grid-template-columns:1fr;} }
  .jewel-cell{min-width:0;}
  .jewel-cell-title{font-size:12.5px;font-weight:700;margin-bottom:6px;line-height:1.45;word-break:break-word;}
  .jewel-img-row{display:flex;flex-direction:column;gap:5px;}
  .jewel-slot{width:100%;max-width:308px;aspect-ratio:308/129;border-radius:6px;overflow:hidden;
    border:1px solid var(--border);background:#0d0f16;}
  .jewel-slot img{width:100%;height:100%;object-fit:contain;display:block;}
  .jewel-slot.no-img{display:flex;align-items:center;justify-content:center;background:var(--panel-2);}
  .jewel-slot.no-img .placeholder-text{font-size:11px;color:var(--text-dim);}
  .pv-level{margin-bottom:18px;}
  .pv-level-label{font-family:var(--font-display);font-weight:700;font-size:17px;margin-bottom:8px;}
  .pv-thumb-grid{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;}
  .pv-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex:none;}
  .pv-thumb.no-img{background:var(--panel-2);display:flex;align-items:center;justify-content:center;}
  .pv-thumb.no-img .placeholder-text{font-size:9px;color:var(--text-dim);text-align:center;padding:3px;line-height:1.2;word-break:break-word;}
  .pv-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .pv-empty{font-size:12px;color:var(--text-dim);border:1px dashed var(--border);border-radius:8px;padding:10px 14px;}
  .pv-badges{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;}
  .pv-badge-img{height:46px;border-radius:7px;overflow:hidden;border:1px solid var(--border);background:#0d0f16;box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .pv-badge-img img{height:100%;width:auto;display:block;object-fit:contain;}
  .pv-badge-img.no-img{display:flex;align-items:center;justify-content:center;min-width:140px;background:var(--panel-2);}
  .pv-badge-img.no-img .placeholder-text{font-size:11px;color:var(--text-dim);padding:0 10px;}
  .badge-thumb.no-img{display:flex;align-items:center;justify-content:center;}
  .badge-thumb.no-img .placeholder-text{font-size:10px;color:var(--text-dim);text-align:center;padding:2px;}
  .pv-caption{margin-top:14px;font-size:11px;color:var(--text-dim);}

  footer.app-footer{text-align:center;color:var(--text-dim);font-size:11.5px;padding:20px;}

  .section-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0;}
  .nav-tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-dim);
    font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:6px 6px 0 0;}
  .nav-tab:hover{color:var(--text);}
  .nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .footer-link{background:none;border:none;color:var(--text-dim);font-size:11px;text-decoration:underline;
    margin-top:6px;padding:4px;opacity:.55;}
  .footer-link:hover{color:var(--accent);opacity:1;}

  /* ---- section nav ---- */

  /* ---- tier table ---- */
  .tier-row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);}
  .tier-rank-cell{flex:none;width:70px;border-left:4px solid var(--border);padding-left:10px;}
  .tier-rank-label{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.2;}
  .tier-rank-points{font-size:11px;color:var(--text-dim);}
  .tier-groups{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
  .tier-group-label{font-size:12px;font-weight:700;color:#ffffff;margin-bottom:5px;}
  .tier-edit-group{margin-top:10px;}
  .lr-mark{position:absolute;left:0;bottom:0;background:rgba(10,11,18,.85);color:#ffe14f;font-size:9px;
    padding:1px 3px;border-radius:0 5px 0 0;letter-spacing:-.02em;}
  .tbtn.active-lr{background:#ffe14f;border-color:#ffe14f;color:#111;}
  .plate-input{width:56px;background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:5px;padding:3px 4px;font-size:10px;}
  .tier-total-title{font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:10px;}

  .ptier-band{margin-bottom:20px;}
  .ptier-band-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border);}
  .ptier-band-label{font-family:var(--font-display);font-weight:800;font-size:20px;}
  .ptier-doc-title{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--text);}
  .ptier-band-meta{font-size:11px;color:var(--text-dim);}
  .ptier-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:6px 10px;margin-bottom:6px;}
  .ptier-badge-thumb{width:40px;height:40px;border-radius:6px;overflow:hidden;border:1px solid var(--border);
    background:var(--panel);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:16px;}
  .ptier-badge-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .ptier-name{flex:1;min-width:0;font-size:13px;word-break:break-word;}
  .ptier-count{font-size:11px;color:var(--text-dim);flex:none;}
  .ptier-points{font-family:var(--font-display);font-weight:700;color:var(--accent);flex:none;font-size:13px;}

  .lr-corner-badge{position:absolute;top:12px;right:14px;font-size:11.5px;font-weight:700;color:#ffe14f;
    border:1px solid #ffe14f;border-radius:6px;padding:3px 8px;background:rgba(10,11,18,.6);}
  .ptier-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .ptier-cell{display:flex;flex-direction:column;gap:3px;align-items:center;width:112px;}
  .ptier-cell .ptier-badge-thumb{width:112px;height:40px;}
  .ptier-cell-name{font-size:10px;color:var(--text-dim);text-align:center;word-break:break-word;line-height:1.3;}
  .ptier-badge-thumb.no-img{background:var(--panel-2);}
  .ptier-badge-thumb.no-img .placeholder-text{font-size:10px;color:var(--text-dim);text-align:center;padding:2px;}
  .tier-total-table{display:flex;flex-direction:column;gap:4px;}
  .tier-total-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:7px;padding:7px 12px;font-size:12.5px;}
  .tt-rank{color:var(--text-dim);font-family:var(--font-display);font-weight:700;width:34px;flex:none;}
  .tt-name{flex:1;min-width:0;word-break:break-word;}
  .tt-count{color:var(--text-dim);font-size:11px;flex:none;}
  .tt-points{font-family:var(--font-display);font-weight:700;color:var(--accent);flex:none;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(6,7,12,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .modal-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:380px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .modal-box p{margin:0 0 16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}

  .song-picker-search{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 10px;font-size:13.5px;margin-bottom:8px;}
  .song-picker-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:3px;min-height:120px;}
  .song-pick-row{text-align:left;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:12.5px;}
  .song-pick-row:hover{border-color:var(--accent);}
  .picker-group-label{font-size:11px;font-weight:700;color:var(--accent);margin:8px 0 2px;padding-left:2px;}
  .thumb-pick-add{width:56px;height:56px;border-radius:8px;border:1px dashed var(--border);background:var(--panel);
    color:var(--text-dim);font-size:9px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;line-height:1.2;}
  .thumb-pick-add:hover{border-color:var(--accent);color:var(--accent);}
  .thumb.no-img{background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .thumb.no-img .placeholder-text{font-size:8.5px;color:var(--text-dim);text-align:center;padding:2px;line-height:1.2;
    word-break:break-word;}
  .song-name-tag{position:absolute;left:0;right:0;bottom:0;background:rgba(10,11,18,.78);color:#fff;font-size:8px;
    padding:1px 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>

  function uid(){ return Math.random().toString(36).slice(2,9); }

  function el(tag, attrs, children){
    attrs = attrs || {}; children = children || [];
    var node = document.createElement(tag);
    Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k.indexOf('on') === 0 && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if (v === true) node.setAttribute(k, '');
      else if (v === false || v === null || v === undefined) { /* skip */ }
      else node.setAttribute(k, v);
    });
    children.forEach(function(c){
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  }

  function shade(hex, amt){
    var c = hex.replace('#','');
    if (c.length === 3) c = c.split('').map(function(ch){ return ch+ch; }).join('');
    var num = parseInt(c, 16) || 0;
    var r = Math.min(255, Math.max(0, (num >> 16) + amt));
    var g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amt));
    var b = Math.min(255, Math.max(0, (num & 0xff) + amt));
    return '#' + [r,g,b].map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join('');
  }

  function resizeImageFile(file, maxSize, quality){
    maxSize = maxSize || 120; quality = quality || 0.78;
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(reader.error); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('image load failed')); };
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* 読み込み失敗時にフォールバックする <img> を作る共通関数 */
  function makeResolvedImg(primarySrc, fallbackDataUrl, onAllFailed){
    var img = el('img', {src: primarySrc, alt:''});
    var triedFallback = false;
    img.addEventListener('error', function(){
      if (!triedFallback && fallbackDataUrl && fallbackDataUrl !== primarySrc){
        triedFallback = true;
        img.src = fallbackDataUrl;
        return;
      }
      if (img.parentNode) img.parentNode.removeChild(img);
      if (onAllFailed) onAllFailed();
    });
    return img;
  }

  var COLOR_ORDER = ['緑','黄','赤','紫','白'];

  function getTierCount(priceRangeText){
    var found = [];
    (priceRangeText || '').split('').forEach(function(ch){
      var idx = COLOR_ORDER.indexOf(ch);
      if (idx >= 0) found.push(idx);
    });
    if (found.length < 1) return null;
    var start = found[0], end = found[found.length - 1];
    return Math.abs(end - start) + 1;
  }

  function roundUpToHundred(n){
    var rem = n % 100;
    return rem === 0 ? n : (n - rem + 100);
  }

  function computeAutoPrice(songCount){
    var p1 = songCount * 3 / 3 * 100;
    var p2raw = songCount * 3 / 4 * 100;
    return { p1: Math.round(p1), p2: roundUpToHundred(Math.round(p2raw)) };
  }

  function computeAutoTime(songCount, tiers){
    if (!tiers) return null;
    var totalSeconds = songCount * tiers * SEC_PER_CHART;
    var wholeMinutes = Math.floor(totalSeconds / 60);
    var remainderSeconds = totalSeconds - wholeMinutes * 60;
    var finalMinutes = wholeMinutes;
    if (remainderSeconds >= 31) finalMinutes += 1;
    var hours = Math.floor(finalMinutes / 60);
    var mins = finalMinutes % 60;
    return hours > 0 ? (hours + '時間' + mins + '分') : (mins + '分');
  }

  function yen(n){ return n.toLocaleString('ja-JP') + '円'; }

  function fmtDate(ts){

    var d = new Date(ts);

  }

  function loadScriptOnce(src){
    return new Promise(function(resolve, reject){
      var existing = document.querySelector('script[data-src="' + src + '"]');
      if (existing){ resolve(); return; }
      var s = document.createElement('script');
      s.src = src;
      s.setAttribute('data-src', src);
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error('スクリプトの読み込みに失敗しました: ' + src)); };
      document.head.appendChild(s);
    });
  }

  function loadFirebaseSDK(){
    if (window.firebase && window.firebase.firestore) return Promise.resolve();
    var base = 'https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/';
    return loadScriptOnce(base + 'firebase-app-compat.min.js')
      .then(function(){ return loadScriptOnce(base + 'firebase-auth-compat.min.js'); })
      .then(function(){ return loadScriptOnce(base + 'firebase-firestore-compat.min.js'); });
  }

  function attachSyncListeners(){
    if (syncState.unsubVersions) syncState.unsubVersions();
    syncState.unsubVersions = syncState.db.collection('plates').onSnapshot(function(snap){
      allVersions = snap.docs.map(function(d){ return d.data(); });
      renderApp();
    }, function(err){
      syncState.error = '同期エラー（プレート表）: ' + err.message;
      renderApp();
    });
    if (syncState.isAdmin){
      if (syncState.unsubReviews) syncState.unsubReviews();
      syncState.unsubReviews = syncState.db.collection('reviews').onSnapshot(function(snap){
        allReviews = snap.docs.map(function(d){ var o = d.data(); o._docId = d.id; return o; });
        allReviews.sort(function(a,b){ return (b.submittedAt||0) - (a.submittedAt||0); });
        renderApp();
      }, function(err){
        syncState.error = '同期エラー（レビュー一覧）: ' + err.message;
        renderApp();
      });
    }
  }

  function connectSync(configObj, email, password, onDone){
    syncState.connecting = true;
    syncState.error = '';
    loadFirebaseSDK().then(function(){
      try{
        var app = (window.firebase.apps && window.firebase.apps.length) ? window.firebase.apps[0] : window.firebase.initializeApp(configObj);
        syncState.db = window.firebase.firestore();
        var finish = function(isAdmin){
          syncState.connected = true;
          syncState.connecting = false;
          syncState.isAdmin = isAdmin;
          persistSyncSettings({ configJson: JSON.stringify(configObj), adminEmail: email || '' });
          attachSyncListeners();
          onDone(null);
        };
        if (email && password){
          window.firebase.auth().signInWithEmailAndPassword(email, password).then(function(){
            finish(true);
          }).catch(function(err){
            syncState.connecting = false;
            onDone(err);
          });
        } else {
          finish(false);
        }
      }catch(e){
        syncState.connecting = false;
        onDone(e);
      }
    }).catch(function(e){
      syncState.connecting = false;
      onDone(e);
    });
  }

  /* ---- 表示順：バージョン実装順 → 舞・覇者 → 実績フレーム表 ---- */
  function versionOrderIndex(v){
    if (v.docType === 'jewel') return 100000;              /* 常に最後 */
    var badges = v.badges || [];
    for (var i = 0; i < badges.length; i++){
      var nm = badges[i].name;
      if (!nm) continue;
      for (var k = 0; k < PLATE_MASTER_LIST.length; k++){
        if (PLATE_MASTER_LIST[k].name === nm){
          var ver = PLATE_MASTER_LIST[k].ver;
          if (ver === '舞 ＆ 覇者対象Re:MASTER'){
            /* 舞・覇者は2種類ある。
               「Re:MASTER（上位）」→ 実績フレーム表の2つ前
               「下位」            → 実績フレーム表の1つ前
               タイトルや補足説明に「下位」「以下」が含まれていれば下位と判定する。 */
            var hint = (v.versionName || '') + ' ' + (v.subtitleText || '');
            var isLower = (hint.indexOf('下位') >= 0) || (hint.indexOf('以下') >= 0);
            return isLower ? 99500 : 99000;
          }
          /* PLATE_MASTER_LIST は実装順に並んでいるので、その出現位置を順序に使う */
          for (var n = 0; n < PLATE_MASTER_LIST.length; n++){
            if (PLATE_MASTER_LIST[n].ver === ver) return n;
          }
        }
      }
    }
    return 98000;   /* プレート未配置のものは舞・覇者の手前 */
  }

  function sortedVersions(){
    return allVersions.slice().sort(function(a, b){
      var d = versionOrderIndex(a) - versionOrderIndex(b);
      if (d !== 0) return d;
      return (a.updatedAt || 0) - (b.updatedAt || 0);
    });
  }

  /* ---- プレートのバッジ画像キャッシュ（プレート名ごと。ユーザーがアップロードした画像をこの端末内で記憶） ---- */
  var PLATE_BADGE_CACHE_KEY = 'mmplate_plate_badge_cache_v1';
  function loadPlateBadgeCache(){
    if (!storageOK) return {};
    try{ var raw = localStorage.getItem(PLATE_BADGE_CACHE_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
  }
  var plateBadgeCache = loadPlateBadgeCache();
  function persistPlateBadgeCache(){
    if (!storageOK) return;
    try{ localStorage.setItem(PLATE_BADGE_CACHE_KEY, JSON.stringify(plateBadgeCache)); }catch(e){ /* 容量超過は無視 */ }
  }
  function getCachedPlateBadge(name){ return (name && plateBadgeCache[name]) ? plateBadgeCache[name] : ''; }
  function setCachedPlateBadge(name, dataUrl){ if (!name) return; plateBadgeCache[name] = dataUrl; persistPlateBadgeCache(); }

  /* ---- 開発者があらかじめ用意したプレート画像 ----
     index.html と同じ場所に plates/ フォルダを置き、「プレート名.png」で画像を入れておくと、
     プレート名を選んだ時点で全ての閲覧者にその画像が自動で表示されます。
     例: plates/超極.png, plates/舞舞舞.png
     画像が無い場合はエラーにならず、これまで通り各自のアップロード画像／名前表示にフォールバックします。 */
  var PLATE_IMAGE_DIR = 'plates/';
  var PLATE_IMAGE_EXT = '.png';
  function getBundledPlateImage(name){
    if (!name) return '';
    return PLATE_IMAGE_DIR + encodeURIComponent(name) + PLATE_IMAGE_EXT;
  }
  /* 優先順位: 開発者が用意した画像 → 各自がアップロードした画像 */
  function resolvePlateImage(name){
    return getBundledPlateImage(name) || getCachedPlateBadge(name);
  }
  /* 画像の読み込みに失敗したら、キャッシュ画像→名前表示の順にフォールバックする img を作る */
  function makePlateImg(plateName, fallbackDataUrl, onAllFailed){
    return makeResolvedImg(resolvePlateImage(plateName), fallbackDataUrl, onAllFailed);
  }

  function buildJewelPreviewNode(v){
    var card = el('div', {id:'previewCard'});
    card.appendChild(el('div', {class:'pv-title', style:{color: v.versionNameColor || '#f2f4f8'}, text: v.versionName}));
    if (v.noteText){
      card.appendChild(el('div', {class:'pv-subtitle', style:{color: v.noteColor || '#3fd0ff'}, text: v.noteText}));
    }

    var grid = el('div', {class:'jewel-grid'});
    (v.jewels || []).forEach(function(jw){
      var cell = el('div', {class:'jewel-cell'});
      cell.appendChild(el('div', {class:'jewel-cell-title', style:{color: jw.labelColor || '#f2f4f8'}, text: jw.label}));
      var row = el('div', {class:'jewel-img-row'});
      JEWEL_COND_DEFS.forEach(function(cd){
        var slot = el('div', {class:'jewel-slot'});
        var src = (jw.imgs && jw.imgs[cd.key]) || resolveJewelFrame(jw.stone, cd.suffix);
        if (src){
          slot.appendChild(makeResolvedImg(src, (jw.imgs && jw.imgs[cd.key]) || '', function(){
            slot.classList.add('no-img');
            slot.appendChild(el('span', {class:'placeholder-text', text: cd.suffix}));
          }));
        } else {
          slot.classList.add('no-img');
          slot.appendChild(el('span', {class:'placeholder-text', text: cd.suffix}));
        }
        row.appendChild(slot);
      });
      cell.appendChild(row);
      grid.appendChild(cell);
    });
    card.appendChild(grid);
    return card;
  }

  /* ===== Jewelフレーム表：編集画面 ===== */
  function renderJewelEditView(root){
    var isNew = !currentId;
    var bar = el('div', {class:'view-topbar'});
    bar.appendChild(el('button', {class:'btn btn-ghost', text:'← 戻る', onclick: function(){ isNew ? goList() : goDetail(currentId); }}));

    bar.appendChild(el('button', {class:'btn btn-primary', text:'保存する', onclick: saveDraft}));
    root.appendChild(bar);

    var grid = el('div', {class:'edit-grid'});
    var editorCol = el('div', {});
    var previewCol = el('div', {class:'edit-preview-col'});
    grid.appendChild(editorCol);
    grid.appendChild(previewCol);
    root.appendChild(grid);

    function refreshPreview(){
      previewCol.textContent = '';
      previewCol.appendChild(buildJewelPreviewNode(draft));
    }

    function colorField(labelText, getVal, setVal){
      var f = el('div', {class:'field'});
      f.appendChild(el('label', {text: labelText}));
      var row = el('div', {class:'row-color'});
      var input = el('input', {type:'color'});
      input.value = getVal() || '#f2f4f8';
      var lab = el('span', {class:'note', text: input.value});
      input.addEventListener('input', function(){ setVal(input.value); lab.textContent = input.value; refreshPreview(); });
      row.appendChild(input); row.appendChild(lab);
      f.appendChild(row);
      return f;
    }

    /* --- 解説欄（一番上） --- */
    var noteCard = el('div', {class:'card'});
    noteCard.appendChild(el('h2', {text:'解説'}));

    var titleField = el('div', {class:'field'});
    titleField.appendChild(el('label', {text:'見出し'}));
    var titleInput = el('input', {type:'text'});
    titleInput.value = draft.versionName;
    titleInput.addEventListener('input', function(){ draft.versionName = titleInput.value; refreshPreview(); });
    titleField.appendChild(titleInput);
    noteCard.appendChild(titleField);
    noteCard.appendChild(colorField('見出しの色', function(){ return draft.versionNameColor; }, function(x){ draft.versionNameColor = x; }));

    var noteField = el('div', {class:'field'});
    noteField.appendChild(el('label', {text:'解説文'}));
    var noteInput = el('input', {type:'text'});
    noteInput.value = draft.noteText || '';
    noteInput.addEventListener('input', function(){ draft.noteText = noteInput.value; refreshPreview(); });
    noteField.appendChild(noteInput);
    noteCard.appendChild(noteField);
    noteCard.appendChild(colorField('解説文の色', function(){ return draft.noteColor; }, function(x){ draft.noteColor = x; }));
    editorCol.appendChild(noteCard);

    /* --- 実績フレーム --- */
    var framesCard = el('div', {class:'card'});
    framesCard.appendChild(el('h2', {text:'実績フレーム'}));
    var framesContainer = el('div', {});
    framesCard.appendChild(framesContainer);
    editorCol.appendChild(framesCard);

    function renderFramesEditor(){
      framesContainer.textContent = '';
      (draft.jewels || []).forEach(function(jw){
        var block = el('div', {class:'level-block'});

        var lf = el('div', {class:'field'});
        lf.appendChild(el('label', {text: jw.stone + ' の名称'}));
        var li = el('input', {type:'text'});
        li.value = jw.label;
        li.addEventListener('input', function(){ jw.label = li.value; refreshPreview(); });
        lf.appendChild(li);
        block.appendChild(lf);

        block.appendChild(colorField('名称の色', function(){ return jw.labelColor; }, function(x){ jw.labelColor = x; }));

        var row = el('div', {class:'thumb-grid'});
        JEWEL_COND_DEFS.forEach(function(cd){
          var item = el('div', {class:'thumb-item', style:{width:'104px'}});
          var thumb = el('div', {class:'thumb', style:{width:'104px', height:'44px'}});

          var fi = el('input', {type:'file', accept:'image/*', style:{display:'none'}});
          fi.addEventListener('change', function(){
            var f = fi.files && fi.files[0];
            if (!f) return;
            resizeImageFile(f, 400, 0.85).then(function(url){
              jw.imgs[cd.key] = url;
              setCachedPlateBadge(jewelFrameName(jw.stone, cd.suffix), url);
              renderFramesEditor(); refreshPreview();
            }).catch(function(){ showAlert('画像の読み込みに失敗しました。'); });
          });

          function fallback(){
            thumb.classList.add('no-img');
            thumb.appendChild(el('div', {class:'placeholder-text', text: cd.suffix}));
            thumb.title = 'クリックして画像を追加';
            thumb.addEventListener('click', function(e){
              if (e.target.tagName === 'BUTTON') return;
              fi.click();
            });
          }
          var src = jw.imgs[cd.key] || resolveJewelFrame(jw.stone, cd.suffix);
          if (src){
            var im = makeResolvedImg(src, jw.imgs[cd.key] || '', fallback);
            im.style.objectFit = 'contain';
            thumb.appendChild(im);
            if (jw.imgs[cd.key]){
              thumb.appendChild(el('button', {text:'×', title:'画像を外す', onclick: function(){
                jw.imgs[cd.key] = '';
                renderFramesEditor(); refreshPreview();
              }}));
            }
          } else {
            fallback();
          }
          item.appendChild(thumb);
          item.appendChild(fi);
          item.appendChild(el('div', {class:'ptier-cell-name', text: cd.suffix + '（' + cd.label + '）'}));
          row.appendChild(item);
        });
        block.appendChild(row);
        framesContainer.appendChild(block);
      });
    }

    renderFramesEditor();
    refreshPreview();
  }

  function buildPreviewNode(v){
    if (v && v.docType === 'jewel') return buildJewelPreviewNode(v);

    var card = el('div', {id:'previewCard'});

    var title = el('div', {class:'pv-title', style:{color: v.versionNameColor || '#f2f4f8'}, text: v.versionName});
    card.appendChild(title);

    function appendColoredRange(container, rangeText, startColor, endColor){
      var seps = ['〜','～','~'];
      var sepIdx = -1;
      for (var i = 0; i < rangeText.length; i++){
        if (seps.indexOf(rangeText[i]) >= 0){ sepIdx = i; break; }
      }
      if (sepIdx === -1){
        container.appendChild(el('span', {style:{color:startColor}, text: rangeText}));
        return;
      }
      container.appendChild(el('span', {style:{color:startColor}, text: rangeText.slice(0, sepIdx)}));
      container.appendChild(el('span', {text: rangeText[sepIdx]}));
      container.appendChild(el('span', {style:{color:endColor}, text: rangeText.slice(sepIdx + 1)}));
    }

    var line1 = el('div', {class:'pv-info-line'});
    line1.appendChild(el('span', {class:'label', text:'下埋め料金'}));
    appendColoredRange(line1, v.priceRange, v.rangeStartColor || '#6fdc6f', v.rangeEndColor || '#ff5c5c');
    var bracket1 = el('span', {style:{color: v.bracketColor || '#f2f4f8'}, text: '＜' + v.price1 + '　' + v.price2 + '＞'});
    line1.appendChild(bracket1);
    card.appendChild(line1);

    var line2 = el('div', {class:'pv-info-line'});
    line2.appendChild(el('span', {class:'label', text:'下埋め時間'}));
    appendColoredRange(line2, v.priceRange, v.rangeStartColor || '#6fdc6f', v.rangeEndColor || '#ff5c5c');
    var bracket2 = el('span', {style:{color: v.bracketColor || '#f2f4f8'}, text: '＜' + v.timeText + '＞'});
    line2.appendChild(bracket2);
    if (v.timeExclusionNote){
      line2.appendChild(el('span', {class:'pv-exclusion', text: '（' + v.timeExclusionNote + '）'}));
    }
    card.appendChild(line2);

    if (v.subtitleText){
      card.appendChild(el('div', {class:'pv-subtitle', style:{color: v.subtitleColor || '#3fd0ff'}, text: v.subtitleText}));
    }

    card.appendChild(el('div', {class:'pv-divider'}));

    v.levels.forEach(function(level){
      if (level.hidden) return;
      var block = el('div', {class:'pv-level'});
      block.appendChild(el('div', {class:'pv-level-label', style:{color: level.color}, text: level.label}));
      var visibleSongs = level.songs.filter(function(s){ return !s.hidden; });
      if (visibleSongs.length === 0){
        block.appendChild(el('div', {class:'pv-empty', text:'（画像未追加）'}));
      } else {
        var grid = el('div', {class:'pv-thumb-grid'});
        visibleSongs.forEach(function(song){
          var wrap = el('div', {style:{display:'flex', flexDirection:'column', alignItems:'center', gap:'2px'}});
          var t = el('div', {class:'pv-thumb'});
          var srcS = song.img || resolveSongImage(song.name);
          if (srcS){
            t.appendChild(makeResolvedImg(srcS, getCachedSongImage(song.name), function(){
              t.className = 'pv-thumb no-img';
              t.appendChild(el('div', {class:'placeholder-text', text: song.name || '画像未設定'}));
            }));
          } else {
            t.className = 'pv-thumb no-img';
            t.appendChild(el('div', {class:'placeholder-text', text: song.name || '画像未設定'}));
          }
          if (song.name){
            t.appendChild(el('div', {class:'song-name-tag', text: song.name}));
          }
          if (song.slashed) t.appendChild(el('div', {class:'slash-overlay'}));
          wrap.appendChild(t);
          grid.appendChild(wrap);
        });
        block.appendChild(grid);
      }
      card.appendChild(block);
    });

    card.appendChild(el('div', {class:'pv-divider'}));

    if (v.badges.length === 0){
      card.appendChild(el('div', {class:'pv-empty', text:'（実績プレート画像未追加）'}));
    } else {
      var badgeWrap = el('div', {class:'pv-badges'});
      v.badges.forEach(function(badge){
        var b = el('div', {class:'pv-badge-img'});
        var srcB = badge.img || resolveBadgeImage(badge.name);
        if (srcB){
          b.appendChild(makeResolvedImg(srcB, getCachedPlateBadge(badge.name), function(){
            b.classList.add('no-img');
            b.appendChild(el('span', {class:'placeholder-text', text: badge.name || '画像未設定'}));
          }));
        } else {
          b.classList.add('no-img');
          b.appendChild(el('span', {class:'placeholder-text', text: badge.name || '画像未設定'}));
        }
        badgeWrap.appendChild(b);
      });
      card.appendChild(badgeWrap);
    }

    return card;
  }

  /* ========================= export PNG ========================= */
  function exportPNG(v, statusEl, btn){
    btn.disabled = true;
    statusEl.textContent = '画像を生成中…';
    var node = document.getElementById('previewCard');
    window.html2canvas(node, { scale: 2, backgroundColor: '#0d0f16' }).then(function(canvas){
      var link = document.createElement('a');
      var name = (v.versionName || 'plate').replace(/[\\/:*?"<>|]/g, '');
      link.download = name + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      statusEl.textContent = '保存しました';
      btn.disabled = false;
      setTimeout(function(){ statusEl.textContent = ''; }, 2500);
    }).catch(function(){
      statusEl.textContent = '画像の生成に失敗しました';
      btn.disabled = false;
    });
  }

  /* ========================= backup JSON (all versions) ========================= */
  function exportAllJSON(){
    var payload = { format: 'mmplate-backup-v4', versions: allVersions };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.download = 'maimai_plate_archive_backup.json';
    link.href = url;
    link.click();
    URL.revokeObjectURL(url);
  }

  function importAllJSON(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var loaded = JSON.parse(reader.result);
        var newVersions;
        if (Array.isArray(loaded)){
          newVersions = loaded;                 /* 旧形式（配列のみ） */
        } else if (loaded && Array.isArray(loaded.versions)){
          newVersions = loaded.versions;        /* 新形式 */
        } else {
          throw new Error('invalid');
        }
        showConfirm('保存されているプレート表（' + allVersions.length + '件）を、読み込んだファイルの内容（' + newVersions.length + '件）で置き換えます。よろしいですか？', function(){
          allVersions = newVersions;
          persistVersions();
          goList();
        });
      }catch(e){
        showAlert('このファイルは読み込めませんでした。「全データをエクスポート」で保存したJSONファイルを選んでください。');
      }
    };
    reader.readAsText(file);
  }

        var thumbs = el('div', {class:'vc-thumbs'});
        var shown = 0;
        v.levels.forEach(function(l){
          l.songs.forEach(function(s){
            if (s.hidden) return;
            if (shown >= 6) return;
            var t = el('div', {class:'vc-thumb'});
            t.appendChild(makeResolvedImg(s.img || resolveSongImage(s.name), getCachedSongImage(s.name), null));
            if (s.slashed) t.appendChild(el('div', {class:'slash-overlay'}));
            thumbs.appendChild(t);
            shown++;
          });
        });
        card.appendChild(thumbs);
        card.appendChild(el('div', {class:'vc-badges', text: '実績プレート ' + v.badges.length + '枚'}));
      }

      if (canEdit()){
        var actions = el('div', {class:'vc-actions'});
        actions.appendChild(el('button', {class:'btn btn-sm', text:'編集', onclick: function(e){ e.stopPropagation(); goEditExisting(v.id); }}));
        actions.appendChild(el('button', {class:'btn btn-sm', text:'複製', onclick: function(e){ e.stopPropagation(); goDuplicate(v.id); }}));
        actions.appendChild(el('button', {class:'btn btn-sm btn-danger', text:'削除', onclick: function(e){ e.stopPropagation(); deleteVersion(v.id); }}));
        card.appendChild(actions);
      }

      grid.appendChild(card);
    });
    root.appendChild(grid);
  }

  function askPlateCategoryThenCreate(){
    var chosenCat = null;

    var box = el('div', {class:'modal-box'});

      msg.textContent = '作成する' + chosenCat + 'プレート難易度表の左右差について';

  function buildPlateTierPreviewNode(t){
    var card = el('div', {id:'previewCard', style:{position:'relative'}});
    card.appendChild(el('div', {class:'lr-corner-badge', text: t.showLeftRight ? '左右差あり' : '左右差なし'}));
    card.appendChild(el('div', {class:'pv-title', text: t.title}));
    card.appendChild(el('div', {class:'note', style:{marginBottom:'14px'}, text:'制覇系プレート「' + t.category + '」の難易度表'}));

    var any = t.ranks.some(function(r){
      return (r.jiriki || []).length > 0 || (r.kojinsa || []).length > 0;
    });
    if (!any){
      card.appendChild(el('div', {class:'pv-empty', text:'（まだプレートが追加されていません）'}));
      return card;
    }

    t.ranks.forEach(function(rank){
      var jiriki = rank.jiriki || [];
      var kojinsa = rank.kojinsa || [];
      if (jiriki.length === 0 && kojinsa.length === 0) return;

      var section = el('div', {class:'ptier-band'});
      var head = el('div', {class:'ptier-band-head'});
      head.appendChild(el('div', {class:'ptier-band-label', style:{color: rank.color}, text: rank.label}));
      section.appendChild(head);

      [['jiriki','地力'], ['kojinsa','個人差']].forEach(function(pair){
        var key = pair[0], name = pair[1];
        var plates = rank[key] || [];
        var g = el('div', {class:'tier-group', style:{marginBottom:'10px'}});
        g.appendChild(el('div', {class:'tier-group-label', text: name + ' ' + rank.label}));
        if (plates.length === 0){
          g.appendChild(el('div', {class:'pv-empty', text:'（なし）'}));
        } else {
          var grid = el('div', {class:'ptier-grid'});
          plates.forEach(function(p){
            var cell = el('div', {class:'ptier-cell'});
            var thumb = el('div', {class:'ptier-badge-thumb'});
            var srcImg = p.img || resolvePlateImage(p.name);
            if (srcImg){
              thumb.appendChild(makePlateImg(p.name, getCachedPlateBadge(p.name), function(){
                /* 画像が用意されていない場合は名前表示にフォールバック */
                thumb.className = 'ptier-badge-thumb no-img';
                thumb.appendChild(el('span', {class:'placeholder-text', text: p.name}));
              }));
            } else {
              thumb.className = 'ptier-badge-thumb no-img';
              thumb.appendChild(el('span', {class:'placeholder-text', text: p.name}));
            }
            cell.appendChild(thumb);
            grid.appendChild(cell);
          });
          g.appendChild(grid);
        }
        section.appendChild(g);
      });

      card.appendChild(section);
    });

    return card;
  }

      card.appendChild(el('div', {class:'vc-title', text: t.title}));
      card.appendChild(el('div', {class:'vc-meta vc-meta-strong', text:
        '種類 ' + t.category + '　左右差欄 ' + (t.showLeftRight ? 'あり' : 'なし') + '　更新 ' + fmtDate(t.updatedAt)}));
      if (canEdit()){
        var actions = el('div', {class:'vc-actions'});
        actions.appendChild(el('button', {class:'btn btn-sm', text:'編集', onclick: function(e){ e.stopPropagation(); goPlateTierEditExisting(t.id); }}));
        actions.appendChild(el('button', {class:'btn btn-sm', text:'複製', onclick: function(e){ e.stopPropagation(); goPlateTierDuplicate(t.id); }}));
        actions.appendChild(el('button', {class:'btn btn-sm btn-danger', text:'削除', onclick: function(e){ e.stopPropagation(); deletePlateTier(t.id); }}));
        card.appendChild(actions);
      }
      grid.appendChild(card);
    });
    root.appendChild(grid);
  }

  function renderPlateTierDetailView(root, t){
    if (!t){ goPlateTierList(); return; }
    var bar = el('div', {class:'view-topbar'});
    bar.appendChild(el('button', {class:'btn btn-ghost', text:'← 一覧に戻る', onclick: goPlateTierList}));
    bar.appendChild(el('div', {style:{flex:'1'}}));
    var statusEl = el('span', {class:'note', style:{width:'auto'}});
    var pngBtn = el('button', {class:'btn', text:'画像として保存（PNG）'});
    pngBtn.addEventListener('click', function(){ exportPNG({versionName: t.title}, statusEl, pngBtn); });
    bar.appendChild(pngBtn);
    if (canEdit()){
      bar.appendChild(el('button', {class:'btn', text:'編集', onclick: function(){ goPlateTierEditExisting(t.id); }}));
      bar.appendChild(el('button', {class:'btn', text:'複製', onclick: function(){ goPlateTierDuplicate(t.id); }}));
      bar.appendChild(el('button', {class:'btn btn-danger', text:'削除', onclick: function(){ deletePlateTier(t.id); }}));
    }
    root.appendChild(bar);
    root.appendChild(statusEl);
    root.appendChild(buildPlateTierPreviewNode(t));
    root.appendChild(el('div', {class:'pv-caption', text:'最終更新: ' + fmtDate(t.updatedAt)}));
  }

  function renderPlateTierEditView(root){
    var isNew = !plateTierCurrentId;
    var bar = el('div', {class:'view-topbar'});
    bar.appendChild(el('button', {class:'btn btn-ghost', text:'← 戻る', onclick: function(){
      isNew ? goPlateTierList() : goPlateTierDetail(plateTierCurrentId);
    }}));
    bar.appendChild(el('h2', {text: (isNew ? '新しいプレート難易度表' : 'プレート難易度表を編集') + '（' + plateTierDraft.category + '）'}));
    bar.appendChild(el('button', {class:'btn btn-primary', text:'保存する', onclick: savePlateTierDraft}));
    root.appendChild(bar);

    var grid = el('div', {class:'edit-grid'});
    var editorCol = el('div', {});
    var previewCol = el('div', {class:'edit-preview-col'});
    grid.appendChild(editorCol);
    grid.appendChild(previewCol);
    root.appendChild(grid);

    function refreshPreview(){
      previewCol.textContent = '';
      previewCol.appendChild(buildPlateTierPreviewNode(plateTierDraft));
    }

    /* タイトル（固定表示） */
    var infoCard = el('div', {class:'card'});
    infoCard.appendChild(el('div', {class:'ptier-doc-title', text: plateTierDraft.title}));

    var lrRow = el('div', {class:'field', style:{marginTop:'10px'}});
    lrRow.appendChild(el('label', {text:'左右差'}));
    var lrBtn = el('button', {
      class: 'btn btn-sm' + (plateTierDraft.showLeftRight ? '' : ' btn-hidden-on'),
      text: plateTierDraft.showLeftRight ? 'あり' : 'なし'
    });
    lrBtn.addEventListener('click', function(){
      plateTierDraft.showLeftRight = !plateTierDraft.showLeftRight;
      lrBtn.textContent = plateTierDraft.showLeftRight ? 'あり' : 'なし';
      lrBtn.className = 'btn btn-sm' + (plateTierDraft.showLeftRight ? '' : ' btn-hidden-on');
      renderRanksEditor();
      refreshPreview();
    });
    lrRow.appendChild(lrBtn);
    infoCard.appendChild(lrRow);
    editorCol.appendChild(infoCard);

    /* ランク編集 */
    var ranksCard = el('div', {class:'card'});
    var ranksHead = el('h2', {text:'ランク '});
    ranksHead.appendChild(el('span', {class:'hint', text:'（上から難しい順）'}));
    ranksCard.appendChild(ranksHead);
    var ranksContainer = el('div', {});
    ranksCard.appendChild(ranksContainer);
    ranksCard.appendChild(el('button', {class:'btn btn-ghost', text:'＋ ランクを追加', onclick: function(){
      plateTierDraft.ranks.push({ id: uid(), label: '新規', color: '#8890a4', jiriki: [], kojinsa: [] });
      renderRanksEditor();
      refreshPreview();
    }}));
    editorCol.appendChild(ranksCard);

    function renderRanksEditor(){
      ranksContainer.textContent = '';
      plateTierDraft.ranks.forEach(function(rank, rIdx){
        var block = el('div', {class:'level-block'});

        var head = el('div', {class:'level-block-head'});
        var labelInput = el('input', {type:'text'});
        labelInput.value = rank.label;
        labelInput.addEventListener('input', function(){
          rank.label = labelInput.value;
          /* 地力〇〇 / 個人差〇〇 の見出しも追従させる */
          if (block.__groupLabels){
            block.__groupLabels.forEach(function(g){ g.node.textContent = g.name + ' ' + rank.label; });
          }
          refreshPreview();
        });
        head.appendChild(labelInput);

        head.appendChild(el('div', {class:'spacer'}));
        head.appendChild(el('button', {class:'btn btn-sm', text:'▲', disabled: rIdx===0, onclick: function(){
          var tmp = plateTierDraft.ranks[rIdx-1];
          plateTierDraft.ranks[rIdx-1] = plateTierDraft.ranks[rIdx];
          plateTierDraft.ranks[rIdx] = tmp;
          renderRanksEditor(); refreshPreview();
        }}));
        head.appendChild(el('button', {class:'btn btn-sm', text:'▼', disabled: rIdx===plateTierDraft.ranks.length-1, onclick: function(){
          var tmp = plateTierDraft.ranks[rIdx+1];
          plateTierDraft.ranks[rIdx+1] = plateTierDraft.ranks[rIdx];
          plateTierDraft.ranks[rIdx] = tmp;
          renderRanksEditor(); refreshPreview();
        }}));
        head.appendChild(el('button', {class:'btn btn-sm btn-danger', text:'削除', onclick: function(){
          plateTierDraft.ranks = plateTierDraft.ranks.filter(function(r){ return r.id !== rank.id; });
          renderRanksEditor(); refreshPreview();
        }}));
        block.appendChild(head);

        [['jiriki','地力'], ['kojinsa','個人差']].forEach(function(pair){
          var key = pair[0], groupName = pair[1];
          var groupWrap = el('div', {class:'tier-edit-group'});
          var groupLabelNode = el('div', {class:'tier-group-label', text: groupName + ' ' + rank.label});
          groupWrap.appendChild(groupLabelNode);
          if (!block.__groupLabels) block.__groupLabels = [];
          block.__groupLabels.push({ node: groupLabelNode, name: groupName });

          var grid2 = el('div', {class:'thumb-grid'});
          (rank[key] || []).forEach(function(p){
            var item = el('div', {class:'thumb-item', style:{width:'92px'}});
            var thumb = el('div', {class:'thumb', style:{width:'92px', height:'34px'}});

            var perFileInput = el('input', {type:'file', accept:'image/*', style:{display:'none'}});
            perFileInput.addEventListener('change', function(){
              var f = perFileInput.files && perFileInput.files[0];
              if (!f) return;
              resizeImageFile(f, 300, 0.85).then(function(url){
                p.img = url;
                setCachedPlateBadge(p.name, url);
                renderRanksEditor(); refreshPreview();
              }).catch(function(){
                showAlert('画像の読み込みに失敗しました。別の画像でお試しください。');
              });
            });

            function showPlateNameFallback(){
              thumb.className = 'thumb no-img';
              thumb.appendChild(el('div', {class:'placeholder-text', text: p.name}));
              thumb.title = 'クリックして画像を追加';
              thumb.addEventListener('click', function(e){
                if (e.target.tagName === 'BUTTON') return;
                perFileInput.click();
              });
            }
            var srcImg = p.img || resolvePlateImage(p.name);
            if (srcImg){
              var pimg = makePlateImg(p.name, getCachedPlateBadge(p.name), showPlateNameFallback);
              pimg.style.objectFit = 'contain';
              thumb.appendChild(pimg);
            } else {
              showPlateNameFallback();
            }
            thumb.appendChild(el('button', {text:'×', title:'削除', onclick: function(){
              rank[key] = rank[key].filter(function(x){ return x.id !== p.id; });
              renderRanksEditor(); refreshPreview();
            }}));
            item.appendChild(thumb);
            item.appendChild(perFileInput);

            grid2.appendChild(item);
          });

          grid2.appendChild(el('div', {class:'thumb-pick-add', style:{width:'92px', height:'34px'}, text:'＋ プレート追加', title: plateTierDraft.category + 'プレートから選ぶ（' + groupName + '）', onclick: function(){
            openPlatePicker(plateTierDraft.category, function(picked){
              rank[key].push({
                id: uid(),
                name: picked.name,
                img: resolvePlateImage(picked.name),
                leftRight: false
              });
              renderRanksEditor(); refreshPreview();
            });
          }}));
          groupWrap.appendChild(grid2);
          block.appendChild(groupWrap);
        });

        ranksContainer.appendChild(block);
      });
    }

    renderRanksEditor();
    refreshPreview();
  }

  function renderReviewsSection(root){
    var bar = el('div', {class:'view-topbar'});
    bar.appendChild(el('h2', {text:'レビュー'}));
    root.appendChild(bar);

    if (syncState.connected && syncState.isAdmin){
      root.appendChild(el('div', {class:'note', style:{marginBottom:'14px'}, text:'このツールについて訪問者から届いた感想・要望の一覧です（開発者だけが見られます）。'}));
      if (allReviews.length === 0){
        var empty = el('div', {class:'empty-state'});
        empty.appendChild(el('h3', {text:'届いているレビューはありません'}));
        root.appendChild(empty);
        return;
      }
      allReviews.forEach(function(rev){
        var card = el('div', {class:'submission-card'});
        if (rev.rating){
          card.appendChild(el('div', {class:'star-row', text: '★'.repeat(rev.rating) + '☆'.repeat(5 - rev.rating)}));
        }
        card.appendChild(el('div', {style:{fontSize:'13px', margin:'6px 0', whiteSpace:'pre-wrap'}, text: rev.message}));
        card.appendChild(el('div', {class:'vc-meta', text: fmtDate(rev.submittedAt)}));
        var actions = el('div', {class:'vc-actions'});
        actions.appendChild(el('button', {class:'btn btn-sm btn-danger', text:'削除', onclick: function(){ deleteReview(rev); }}));
        card.appendChild(actions);
        root.appendChild(card);
      });
      return;
    }

    if (!syncState.connected){
      var box0 = el('div', {class:'empty-state'});
      box0.appendChild(el('h3', {text:'このツールへのレビュー'}));
      box0.appendChild(el('div', {text:'レビュー機能を使うには、このサイトが「☁ 同期設定」で接続されている必要があります（サイト作成者側の設定です）。'}));
      root.appendChild(box0);
      return;
    }

    var card2 = el('div', {class:'card'});
    card2.appendChild(el('h2', {text:'このツールへの感想・要望を送る'}));
    card2.appendChild(el('div', {class:'note', style:{marginBottom:'10px'}, text:'開発者だけが読むことができます。'}));

    var selectedRating = 0;
    var starRow = el('div', {class:'star-row'});
    var starButtons = [];
    for (var i = 1; i <= 5; i++){
      (function(n){
        var b = el('button', {class:'star-btn', text:'☆', title: n + '点'});
        b.addEventListener('click', function(){
          selectedRating = n;
          starButtons.forEach(function(sb, idx){ sb.textContent = (idx < n) ? '★' : '☆'; });
        });
        starButtons.push(b);
        starRow.appendChild(b);
      })(i);
    }
    card2.appendChild(starRow);

    var msgArea = el('textarea', {placeholder:'使ってみた感想や、こうしてほしい機能などをお書きください', style:{width:'100%', minHeight:'100px', background:'var(--panel-2)', border:'1px solid var(--border)', color:'var(--text)', borderRadius:'8px', padding:'8px 10px', fontSize:'13px', marginTop:'10px'}});
    card2.appendChild(msgArea);

    var sendBtn = el('button', {class:'btn btn-primary', style:{marginTop:'10px'}, text:'送信する'});
    sendBtn.addEventListener('click', function(){
      sendBtn.disabled = true;
      submitReview(msgArea.value, selectedRating, function(err){
        sendBtn.disabled = false;
        if (err){ showAlert('送信に失敗しました: ' + err.message); return; }
        msgArea.value = '';
        selectedRating = 0;
        starButtons.forEach(function(sb){ sb.textContent = '☆'; });
        showAlert('送信しました。ありがとうございます！');
      });
    });
    card2.appendChild(sendBtn);
    root.appendChild(card2);
  }

  /* ========================= app root render ========================= */
  /* ========================= 同期設定モーダル ========================= */
  var FIRESTORE_RULES_TEXT = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /plates/{id} {\n      allow read: if true;\n      allow write: if request.auth != null;\n    }\n    match /reviews/{id} {\n      allow create: if true;\n      allow read, update, delete: if request.auth != null;\n    }\n  }\n}";

  function openSyncSettingsModal(){
    var backdrop = el('div', {class:'modal-backdrop'});
    var box = el('div', {class:'modal-box sync-settings-box'});
    box.appendChild(el('p', {text:'☁ 同期設定', style:{fontWeight:'700', marginBottom:'6px'}}));

    var statusText = !syncState.connected
      ? 'この端末のみに保存中（未接続）'
      : (syncState.isAdmin ? '接続中・管理者としてログイン中（編集可）' : '接続中・閲覧専用（公開版）');
    box.appendChild(el('p', {class:'note', text: statusText, style:{marginBottom:'12px'}}));
    if (syncState.error){
      box.appendChild(el('p', {class:'note', style:{color:'#ff8a8a'}, text: syncState.error}));
    }

    if (syncState.connected){
      if (!syncState.isAdmin){
        box.appendChild(el('p', {class:'note', text:'管理者としてログインすると、この端末から編集・投稿の取り込みができるようになります。'}));
      }
      var loginField1 = el('div', {class:'field'});
      loginField1.appendChild(el('label', {text:'管理者メールアドレス'}));
      var emailInput2 = el('input', {type:'email'});
      loginField1.appendChild(emailInput2);
      var loginField2 = el('div', {class:'field'});
      loginField2.appendChild(el('label', {text:'パスワード'}));
      var passInput2 = el('input', {type:'password'});
      loginField2.appendChild(passInput2);
      if (!syncState.isAdmin){
        box.appendChild(loginField1);
        box.appendChild(loginField2);
        var loginBtn = el('button', {class:'btn btn-primary', text:'管理者としてログイン'});
        loginBtn.addEventListener('click', function(){
          var stored = loadSyncSettings();
          var cfg;
          try{ cfg = JSON.parse(stored.configJson); }catch(e){ showAlert('保存済みの設定が壊れています。一度切断して設定し直してください。'); return; }
          connectSync(cfg, emailInput2.value.trim(), passInput2.value, function(err){
            if (err){ showAlert('ログインに失敗しました: ' + err.message); return; }
            closeModal(backdrop);
            renderApp();
          });
        });
        box.appendChild(loginBtn);
      }
      var actions0 = el('div', {class:'modal-actions', style:{marginTop:'14px'}});
      actions0.appendChild(el('button', {class:'btn btn-ghost', text:'閉じる', onclick: function(){ closeModal(backdrop); }}));
      actions0.appendChild(el('button', {class:'btn btn-danger', text:'切断する（この端末のみに戻す）', onclick: function(){
        closeModal(backdrop);
        disconnectSync();
      }}));
      box.appendChild(actions0);
    } else {
      var cfgField = el('div', {class:'field'});
      cfgField.appendChild(el('label', {text:'Firebaseの設定（config）をJSON形式で貼り付け'}));
      var cfgArea = el('textarea', {placeholder:'{"apiKey":"...", "authDomain":"...", "projectId":"...", ...}'});
      cfgField.appendChild(cfgArea);
      box.appendChild(cfgField);

      var emailField = el('div', {class:'field'});
      emailField.appendChild(el('label', {text:'管理者メールアドレス（空欄なら閲覧専用として接続）'}));
      var emailInput = el('input', {type:'email'});
      emailField.appendChild(emailInput);
      box.appendChild(emailField);

      var passField = el('div', {class:'field'});
      passField.appendChild(el('label', {text:'パスワード'}));
      var passInput = el('input', {type:'password'});
      passField.appendChild(passInput);
      box.appendChild(passField);

      var connectBtn = el('button', {class:'btn btn-primary', text:'接続する'});
      connectBtn.addEventListener('click', function(){
        var cfg;
        try{ cfg = JSON.parse(cfgArea.value); }catch(e){ showAlert('Firebaseの設定（config）が正しいJSON形式ではありません。'); return; }
        connectBtn.disabled = true;
        connectBtn.textContent = '接続中…';
        connectSync(cfg, emailInput.value.trim(), passInput.value, function(err){
          connectBtn.disabled = false;
          connectBtn.textContent = '接続する';
          if (err){ showAlert('接続に失敗しました: ' + err.message); return; }
          closeModal(backdrop);
          renderApp();
        });
      });
      box.appendChild(connectBtn);

      var details = el('details');
      details.appendChild(el('summary', {text:'初めての方はこちら（無料でのセットアップ手順）'}));
      var ol = el('ol');
      ol.appendChild(el('li', {text:'https://console.firebase.google.com/ でプロジェクトを新規作成（無料）'}));
      ol.appendChild(el('li', {text:'左メニュー「Firestore Database」→「データベースの作成」（本番環境モードでOK）'}));
      ol.appendChild(el('li', {text:'左メニュー「Authentication」→「Sign-in method」で「メール/パスワード」を有効化'}));
      ol.appendChild(el('li', {text:'「Users」タブから、自分用の管理者アカウント（メール・パスワード）を1つ作成'}));
      ol.appendChild(el('li', {text:'「プロジェクトの設定」→「全般」→「マイアプリ」でウェブアプリを追加し、表示されたconfigを上に貼り付け'}));
      ol.appendChild(el('li', {text:'「Firestore Database」→「ルール」タブに、下のルールを貼り付けて公開'}));
      details.appendChild(ol);
      var rulesArea = el('textarea', {readonly:true, style:{minHeight:'160px'}});
      rulesArea.value = FIRESTORE_RULES_TEXT;
      details.appendChild(rulesArea);
      box.appendChild(details);

      var actions1 = el('div', {class:'modal-actions', style:{marginTop:'12px'}});
      actions1.appendChild(el('button', {class:'btn btn-ghost', text:'閉じる', onclick: function(){ closeModal(backdrop); }}));
      box.appendChild(actions1);
    }

    backdrop.appendChild(box);
    backdrop.addEventListener('click', function(e){ if (e.target === backdrop) closeModal(backdrop); });
    document.body.appendChild(backdrop);
  }

  function renderSyncBar(root){
    /* ホームの同期設定バーは非表示（同期未使用のため）。
       再表示したくなった場合は renderApp() 内の呼び出しを戻す。 */
    if (syncState.connected && !syncState.isAdmin){
      root.appendChild(el('div', {class:'readonly-banner', text:'これは閲覧専用の公開版です。内容の編集はできません。ツールへの感想・要望は「レビュー」から送れます。'}));
    }
  }

  /* ========================= 投稿セクション（難易度表） ========================= */




  var SECTION_LABELS = {
    plates:     '実績プレート表',
    plateTiers: 'プレート難易度メーカー',
    reviews:    'レビュー'
  };

  function renderSectionNav(root){
    var nav = el('div', {class:'section-nav'});
    Object.keys(SECTION_LABELS).forEach(function(key){
      nav.appendChild(el('button', {
        class: 'nav-tab' + (section === key ? ' active' : ''),
        text: SECTION_LABELS[key],
        onclick: function(){ goSection(key); }
      }));
    });
    root.appendChild(nav);
  }

  function renderApp(){
    var root = document.getElementById('app');
    root.textContent = '';

    if (!storageOK){
      root.appendChild(el('div', {class:'storage-warning', text:'このブラウザ環境では自動保存ができません（プレビュー表示の制限の可能性があります）。ダウンロードしたHTMLファイルを直接ブラウザで開くと保存が有効になります。'}));
    } else if (quotaWarning){
      root.appendChild(el('div', {class:'storage-warning', text: quotaWarning}));
    }

    renderSyncBar(root);
    renderSectionNav(root);

    if (section === 'plates'){
      if (view === 'list') renderListView(root);
      else if (view === 'detail') renderDetailView(root, findVersion(currentId));
      else if (view === 'edit') renderEditView(root);
    } else if (section === 'plateTiers'){
      if (plateTierView === 'list') renderPlateTierListView(root);
      else if (plateTierView === 'edit') renderPlateTierEditView(root);
      else renderPlateTierDetailView(root, findPlateTier(plateTierCurrentId));
    } else {
      renderReviewsSection(root);
    }
  }

  function goHome(){ section = 'plates'; goList(); }
  var homeLink = document.getElementById('homeLink');
  if (homeLink) homeLink.addEventListener('click', goHome);
  var homeLogo = document.getElementById('homeLogo');
  if (homeLogo) homeLogo.addEventListener('click', goHome);

  var footerSyncLink = document.getElementById('footerSyncLink');
  if (footerSyncLink) footerSyncLink.addEventListener('click', openSyncSettingsModal);

  var storedSyncSettings = loadSyncSettings();
  if (storedSyncSettings && storedSyncSettings.configJson){
    try{
      var storedCfg = JSON.parse(storedSyncSettings.configJson);
      connectSync(storedCfg, null, null, function(err){
        if (err){ syncState.error = '前回の同期設定への接続に失敗しました: ' + err.message; }
        renderApp();
      });
    }catch(e){ /* 壊れた設定は無視 */ }
  }

  renderApp();

})();
</script>
