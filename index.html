<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>実績プレート表アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&text=TopBtm&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    /* 土台（70%）：暗いグレー。純黒は文字がにじみ目が疲れるので避ける */
    --bg:#131417; --panel:#1b1c21; --panel-2:#23252b; --panel-3:#2c2e35;
    /* 線：区切りは控えめに、入力欄の枠は見分けられる濃さ（3:1以上）に */
    --border:#34363e; --border-ctl:#4a4d57; --border-strong:#6b707c;
    /* 文字：純白を避ける。本文 ≒ 白87%、補足 ≒ 白60%、無効 ≒ 白38% */
    --text:#e3e4e8; --text-dim:#a7abb5; --text-faint:#747883;
    /* 操作色（5%）：彩度を落とした青。強調したい所だけに使う */
    --accent:#8ab4f8; --accent-ink:#0e1b30; --accent-soft:rgba(138,180,248,.13); --accent-line:rgba(138,180,248,.38);
    /* 意味のある色 */
    --ok:#81c995; --ok-soft:rgba(129,201,149,.16);
    --danger:#f28b82; --danger-bg:#c4372e; --danger-soft:rgba(242,139,130,.10); --danger-line:rgba(242,139,130,.34);
    --warn:#fdd663; --warn-soft:rgba(253,214,99,.10); --warn-line:rgba(253,214,99,.34);
    /* 表そのもの（保存される画像）の背景。これまでの表画像と同じ #1e1e1e */
    --canvas:#1e1e1e;
    --radius:12px;
    --font-display:'Orbitron','Noto Sans JP',sans-serif;
    --font-body:'Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;}
  a{color:var(--accent);}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  header.app-header{
    padding:22px clamp(16px,4vw,40px);display:flex;align-items:center;gap:16px;
    border-bottom:1px solid var(--border);background:var(--bg);
  }
  .logo-mark{width:38px;height:38px;position:relative;flex:none;cursor:pointer;}
  .logo-dot{position:absolute;width:8px;height:8px;border-radius:50%;top:15px;left:15px;animation:pulse 2.4s ease-in-out infinite;}
  .logo-mark .c0{background:#f2f4f8;top:15px;left:15px;animation-delay:0s;}
  .logo-mark .c1{background:#ff4fd8;top:0;left:15px;animation-delay:.15s;}
  .logo-mark .c2{background:#ffb84f;top:5px;left:28px;animation-delay:.3s;}
  .logo-mark .c3{background:#3fd0ff;top:23px;left:28px;animation-delay:.45s;}
  .logo-mark .c4{background:#7ee787;top:30px;left:15px;animation-delay:.6s;}
  .logo-mark .c5{background:#b48cff;top:23px;left:2px;animation-delay:.75s;}
  .logo-mark .c6{background:#ffe14f;top:5px;left:2px;animation-delay:.9s;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.35);opacity:1;}}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em;cursor:pointer;}
  header h1:hover{color:var(--accent);}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--text-dim);}

  #app{padding:20px clamp(16px,4vw,40px) 60px;max-width:1180px;margin:0 auto;}

  .storage-warning{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:18px;}
  .viewmode-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:7px 12px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;font-size:12px;}
  .viewmode-bar.is-viewer{background:var(--accent-soft);border-color:var(--accent-line);}
  .viewmode-label{color:var(--text-dim);}
  .viewmode-bar.is-viewer .viewmode-label{color:var(--accent);font-weight:700;}

  .sync-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px;padding:8px 12px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;font-size:12px;}
  .sync-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .sync-dot.off{background:var(--text-faint);}
  .sync-dot.readonly{background:var(--warn);}
  .sync-dot.admin{background:var(--ok);}
  .sync-text{color:var(--text-dim);flex:1;min-width:0;}
  .readonly-banner{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);border-radius:10px;
    padding:9px 10px 9px 14px;font-size:12.5px;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
  .readonly-banner-text{flex:1;min-width:0;}
  .readonly-banner-close{background:transparent;border:none;color:var(--accent);font-size:17px;line-height:1;
    padding:2px 6px;border-radius:6px;flex:none;opacity:.75;}
  .readonly-banner-close:hover{opacity:1;background:var(--panel-3);}

  .sync-settings-box{max-width:480px;}
  .sync-settings-box textarea{width:100%;min-height:90px;background:var(--panel-2);border:1px solid var(--border-strong);
    color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;font-family:monospace;}
  .sync-settings-box input[type=text],.sync-settings-box input[type=email],.sync-settings-box input[type=password]{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:8px 10px;font-size:13px;margin-top:4px;}
  .sync-settings-box .field{margin-bottom:12px;}
  .sync-settings-box .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:2px;}
  .sync-settings-box details{margin-top:10px;font-size:12px;color:var(--text-dim);}
  .sync-settings-box summary{cursor:pointer;color:var(--accent);}
  .sync-settings-box ol{padding-left:18px;margin:8px 0;}
  .sync-settings-box li{margin-bottom:4px;}

  .submission-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
  .submission-card .vc-title{font-weight:700;font-size:14px;margin-bottom:6px;}
  .submission-card .vc-meta{font-size:11.5px;color:var(--text-dim);margin-bottom:10px;}
  .star-row{display:flex;gap:2px;font-size:20px;color:var(--warn);letter-spacing:2px;}
  button.star-btn{background:none;border:none;font-size:22px;color:var(--warn);padding:0 2px;line-height:1;}

  .btn{border:1px solid var(--border-ctl);background:var(--panel-2);color:var(--text);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--accent);background:var(--panel-3);}
  .btn:disabled{opacity:.35;cursor:default;}
  .btn:disabled:hover{border-color:var(--border-ctl);background:var(--panel-2);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn-primary:hover{filter:brightness(1.07);background:var(--accent);}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:5px 9px;font-size:11.5px;border-radius:6px;}
  .btn-danger{color:var(--danger);}

  /* ---- top bars ---- */
  .view-topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px;}
  .view-topbar h2{margin:0;font-size:17px;flex:1;min-width:160px;}
  .view-topbar .note{font-size:11.5px;color:var(--text-dim);width:100%;margin-top:-6px;}

  /* ---- empty state ---- */
  .empty-state{border:1px dashed var(--border);border-radius:14px;padding:44px 20px;text-align:center;color:var(--text-dim);}
  .empty-state h3{color:var(--text);margin-bottom:8px;}
  .empty-state ol{display:inline-block;text-align:left;font-size:12.5px;margin:14px 0;padding-left:18px;}

  /* ---- list / cards ---- */
  .versions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px;}
  @media (max-width:520px){ .versions-grid{grid-template-columns:1fr;} }
  .version-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s;}
  .version-card:hover{border-color:var(--accent);}
  .vc-swatch{width:100%;height:6px;border-radius:4px;margin-bottom:10px;}
  .vc-title{font-weight:700;font-size:14px;margin-bottom:4px;word-break:break-word;}
  .vc-meta{font-size:11.5px;color:var(--text-dim);margin-bottom:10px;}
  .vc-meta-strong{color:var(--text);}
  .vc-thumbs{display:flex;gap:4px;margin-bottom:10px;min-height:28px;flex-wrap:wrap;}

  /* 一覧カード内の縮小プレビュー */
  .card-preview{overflow:hidden;border-radius:8px;border:1px solid var(--border);margin-bottom:10px;
    background:var(--canvas);position:relative;}
  .card-preview-inner{transform:scale(.62);transform-origin:top left;width:161.3%;pointer-events:none;
    position:absolute;top:0;left:0;}
  .card-preview-inner #previewCard{border:none;border-radius:0;padding:14px 14px 0;}
  /* カードの見出しにバージョン名が出ているので、プレビュー内の重複は隠す */
  .card-preview-inner .pv-title{display:none;}
  .card-preview-inner .pv-info-line{font-size:13px;margin-bottom:6px;}

  /* 詳細画面のプレビューを大きく見せる */
  .preview-wide{max-width:900px;}
  .vc-thumb{position:relative;width:26px;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--border);flex:none;}
  .vc-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .vc-badges{font-size:11px;color:var(--text-dim);margin-bottom:10px;}
  .vc-actions{display:flex;flex-wrap:wrap;gap:6px;}

  /* ---- cards (editor) ---- */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 20px;margin-bottom:16px;}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--accent);letter-spacing:.03em;display:flex;align-items:center;gap:8px;}
  .card h2 .hint{font-size:11px;color:var(--text-dim);font-weight:400;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px;}
  .field input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13.5px;}
  .version-select{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
    border-radius:8px;padding:9px 10px;font-size:13.5px;}
  input[type=number]{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13.5px;width:100px;}
  .auto-calc-box{background:var(--panel-2);border:1px dashed var(--border);border-radius:10px;padding:12px;margin-bottom:14px;}
  .auto-calc-box .title{font-size:12px;color:var(--text-dim);margin-bottom:8px;}
  .auto-calc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .auto-calc-caption{margin-top:8px;font-size:11.5px;color:var(--text-dim);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row-color{display:flex;align-items:center;gap:10px;}
  input[type=color]{width:38px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);padding:2px;flex:none;}

  .level-block{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;}
  .level-block.is-level-hidden{opacity:.5;border-style:dashed;}
  .btn-hidden-on{background:var(--panel-3);border-color:var(--border-ctl);color:var(--text-dim);}
  .toggle-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .level-block-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .level-block-head input[type=text]{width:70px;flex:none;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:700;}
  .level-block-head .spacer{flex:1;}
  .thumb-grid{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;}
  .thumb-item{display:flex;flex-direction:column;gap:4px;width:56px;}
  .thumb{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb button{position:absolute;top:0;right:0;width:18px;height:18px;line-height:18px;background:rgba(19,20,23,.88);color:var(--danger);border:none;font-size:11px;padding:0;border-radius:0 0 0 6px;}
  .thumb-controls{display:flex;gap:4px;}
  .tbtn{flex:1;height:22px;min-width:0;border-radius:5px;border:1px solid var(--border-ctl);background:var(--panel);color:var(--text-dim);font-size:11px;padding:0;}
  .slash-overlay{position:absolute;left:-15%;top:46%;width:130%;height:16%;background:#ff2d2d;transform:rotate(-38deg);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.35);}

  .badge-thumb-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .badge-thumb{position:relative;width:150px;height:42px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--panel);}
  .badge-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .badge-thumb button{position:absolute;top:0;right:0;width:18px;height:18px;line-height:18px;background:rgba(19,20,23,.88);color:var(--danger);border:none;font-size:11px;padding:0;border-radius:0 0 0 6px;}

  .edit-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start;}
  @media (max-width:920px){.edit-grid{grid-template-columns:1fr;}}
  .edit-preview-col{position:sticky;top:16px;}

  /* ---- preview (rendered table itself) ---- */
  #previewCard{--pv-pad:clamp(18px,3vw,32px);
    background:var(--canvas);border:1px solid var(--border);border-radius:14px;padding:var(--pv-pad);}
  .pv-title{font-family:var(--font-display);font-size:clamp(30px,4vw,42px);font-weight:800;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:2px;}
  /* タイトルより一段小さく保ちつつ、太字で読みやすくする */
  .pv-info-line{font-size:clamp(21px,2.8vw,29px);font-weight:800;margin-bottom:9px;
    display:flex;flex-wrap:wrap;gap:2px;align-items:baseline;}
  .pv-info-line .label{color:var(--text-dim);margin-right:4px;font-weight:800;}
  .pv-info-line .amt{color:var(--text);margin:0 6px;font-weight:800;}
  .pv-divider{height:1px;background:var(--border);margin:16px 0;}
  .pv-exclusion{color:var(--text-dim);font-size:12px;margin-left:4px;}
  .pv-subtitle{font-size:15px;font-weight:600;margin:2px 0 12px;}

  /* ---- Jewelフレーム表 ---- */
  .jewel-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;margin-top:8px;}
  @media (max-width:760px){ .jewel-grid{grid-template-columns:1fr;} }
  .jewel-cell{min-width:0;}
  .jewel-cell-title{margin-bottom:6px;word-break:break-word;}
  .jewel-title-main{font-size:14px;font-weight:800;line-height:1.35;}
  .jewel-title-sub{font-size:11.5px;font-weight:600;line-height:1.4;opacity:.85;}
  .jewel-img-row{display:flex;flex-direction:column;gap:5px;}
  .jewel-slot{width:100%;max-width:308px;border-radius:6px;overflow:hidden;
    border:1px solid var(--border);background:var(--canvas);}
  .jewel-slot img{width:100%;height:auto;display:block;}
  .jewel-slot.no-img{display:flex;align-items:center;justify-content:center;background:var(--panel-2);}
  .jewel-slot.no-img .placeholder-text{font-size:11px;color:var(--text-dim);}
  .pv-level{margin-bottom:18px;}
  .pv-level-label{font-family:var(--font-display);font-weight:700;font-size:17px;margin-bottom:8px;}
  /* 画像を少し大きくし、そのぶん隙間を詰める。
     1つあたりの間隔（画像＋隙間）は 72px のままなので、折り返す位置は変わらない。 */
  .pv-thumb-grid{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start;}
  /* PNG保存のあいだだけ、楽曲を大きくして12曲ごとに折り返す（画面上の見た目は変えない）。
     プレートは幅の割合で決まるので、全体が同じ比率のまま大きくなる。 */
  .pv-export .pv-thumb-grid{display:grid;grid-template-columns:repeat(12, 100px);
    gap:6px;justify-content:start;}
  .pv-export .pv-thumb{width:100px;height:100px;}
  /* 3枚で1行、楽曲1枚に対して約3.7倍の幅になる */
  .pv-export .pv-badges{margin-left:0;margin-right:0;gap:8px;}
  .pv-export .pv-badge-img{flex:0 0 28%;}
  .pv-thumb{position:relative;width:68px;height:68px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex:none;}
  .pv-thumb.no-img{background:var(--panel-2);display:flex;align-items:center;justify-content:center;}
  .pv-thumb.no-img .placeholder-text{font-size:9px;color:var(--text-dim);text-align:center;padding:3px;line-height:1.2;word-break:break-word;}
  .mark-toggle-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .btn.mark-on{background:var(--danger-bg);border-color:var(--danger-bg);color:#fff;}
  .pv-thumb.is-markable{cursor:pointer;}
  .pv-thumb.is-markable:hover{outline:1px solid var(--accent);}
  .pv-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .pv-empty{font-size:12px;color:var(--text-dim);border:1px dashed var(--border);border-radius:8px;padding:10px 14px;}

  /* ---- シンクのお相手記録（プレート表とは別枠） ---- */
  .sync-card{background:var(--canvas);border:1px solid var(--border);border-radius:14px;
    padding:clamp(18px,3vw,32px);}
  .sync-title{font-family:var(--font-display);font-size:clamp(24px,3.2vw,34px);font-weight:800;
    color:#f2f4f8;margin:0 0 16px;}
  .sync-level-head{display:flex;align-items:center;gap:10px;margin:16px 0 8px;}
  .sync-level{font-family:var(--font-display);font-size:clamp(18px,2.2vw,24px);font-weight:800;}
  .sync-level-toggle{flex:none;}
  /* 保存する画像にはボタンを写さない */
  .sync-export .sync-level-toggle{display:none;}
  .sync-list{display:grid;grid-template-columns:1fr;gap:6px;}
  .sync-row{display:flex;align-items:center;gap:10px;min-width:0;}
  .sync-thumb{position:relative;width:40px;height:40px;border-radius:6px;overflow:hidden;
    border:1px solid var(--border);flex:none;}
  .sync-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .sync-thumb.no-img{background:var(--panel-2);display:flex;align-items:center;justify-content:center;}
  .sync-thumb.no-img .placeholder-text{font-size:7px;color:var(--text-dim);text-align:center;
    padding:2px;line-height:1.15;word-break:break-word;}
  .sync-name{flex:1;min-width:0;}
  .sync-name-input{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);
    color:var(--text);border-radius:7px;padding:7px 9px;font-size:14px;font-family:inherit;}
  /* 保存する画像には入力欄ではなく文字の方を写す（html2canvasは入力欄を苦手とするため） */
  .sync-name-print{display:none;font-size:15px;font-weight:700;color:var(--text);
    padding:7px 2px;border-bottom:1px solid var(--border);min-height:16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sync-export .sync-name-input{display:none;}
  .sync-export .sync-name-print{display:block;}
  /* 保存時だけ2列に並べて、縦に伸びすぎないようにする */
  .sync-export .sync-list{grid-template-columns:repeat(2, 420px);gap:8px 28px;
    justify-content:start;}
  .sync-export .sync-thumb{width:56px;height:56px;}
  .sync-export .sync-name-print{font-size:18px;}
  /* プレートは折り返しで自動的に段組みされる:
       狭い画面（スマホ縦）= 2列 → 極将 / 神舞舞
       広い画面（スマホ横〜PC）= 3列 → 極将神 / 舞舞 */
  /* プレートの並びだけカードの余白ぶん外へ広げ、隙間も詰めて大きく見せる。
     並べ方（縦2列・横3列）と周りの作りはそのまま。 */
  .pv-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;
    margin-left:calc(4px - var(--pv-pad));margin-right:calc(4px - var(--pv-pad));}
  .pv-badge-img{flex:0 0 calc(50% - 2.5px);border-radius:6px;overflow:hidden;
    border:1px solid var(--border);background:var(--canvas);box-shadow:0 2px 6px rgba(0,0,0,.35);}
  /* 高さは画像まかせ。こうすると元の比率のまま拡大・縮小されるだけになる */
  .pv-badge-img img{width:100%;height:auto;display:block;}
  .pv-badge-img.no-img{display:flex;align-items:center;justify-content:center;background:var(--panel-2);}

    .pv-badge-img{flex:0 0 calc(33.333% - 3.34px);}

  .badge-thumb.no-img .placeholder-text{font-size:10px;color:var(--text-dim);text-align:center;padding:2px;}

  .section-nav{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0;}

  .nav-tab:hover{color:var(--text);background:var(--panel);}

  /* ---- 表の解説 ---- */
  .guide{max-width:760px;margin:0 auto;}

  .guide-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:clamp(16px,2.6vw,24px);margin-bottom:14px;}
  .guide-h{font-size:17px;font-weight:800;margin:0 0 12px;padding-left:11px;
    border-left:3px solid var(--accent);line-height:1.35;}
  .guide-p{margin:0 0 10px;line-height:1.9;font-size:14.5px;}
  .guide-p:last-child{margin-bottom:0;}
  .guide-p-tight{margin:0;}
  .guide-sub{font-size:12.5px;font-weight:700;color:var(--text-dim);letter-spacing:.04em;margin:16px 0 8px;}
  .guide-sub:first-of-type{margin-top:0;}
  .guide-mini{font-size:12.5px;font-weight:700;color:var(--text-dim);margin:14px 0 7px;}
  .guide-caption{color:var(--text-dim);line-height:1.8;margin:12px 0 0;}
  /* それぞれ折り返さず1行で。狭い画面では文字を少し小さくして収める */
  .guide-cap-line{white-space:nowrap;font-size:clamp(9.5px,2.6vw,12.5px);overflow-x:auto;}
  .gc-note2{margin-top:4px;line-height:1.7;}
  .gk-caution{color:var(--danger);font-weight:700;}
  .guide-cond-frame .gc-row{grid-template-columns:118px 1fr;}
  .guide-example-box{margin-top:12px;padding:11px 14px;border-radius:10px;
    background:var(--panel-2);border:1px solid var(--border);}
  .guide-example-box .ge-label{margin-bottom:3px;}
  .guide-closing{font-weight:700;}

  /* 獲得条件の表 */
  .guide-cond{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .gc-row{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:11px 14px;align-items:start;}
  .gc-row + .gc-row{border-top:1px solid var(--border);}

  .gc-note{flex-basis:100%;font-size:12.5px;color:var(--text-dim);}

  /* 計算式 */
  .guide-formula{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .gf-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;}
  .gf-val{font-weight:800;font-size:clamp(16px,2.2vw,19px);}
  .gf-op{color:var(--text-dim);font-weight:700;font-size:16px;}
  .gf-result{color:var(--accent);}
  .gf-cap{font-size:12.5px;color:var(--text-dim);margin-top:6px;line-height:1.7;}
  .guide-example{margin-top:12px;padding:2px 0 0 14px;border-left:2px solid var(--border);}
  .ge-label{font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:4px;}
  .ge-line{margin:0 0 3px;font-size:14.5px;line-height:1.8;}
  .ge-result{color:var(--text-dim);}
  .ge-strong{color:var(--text);font-weight:800;}

  .guide-list{margin:0;padding-left:1.2em;line-height:1.9;font-size:14.5px;}
  .guide-list li + li{margin-top:2px;}
  .guide-tags{display:flex;flex-wrap:wrap;gap:6px;}

    background:var(--panel-2);border:1px solid var(--border);}
  .guide-callout{margin-top:12px;padding:11px 14px;border-radius:10px;
    background:var(--danger-soft);border:1px solid var(--danger-line);}

  /* 語句の色（元の資料の色づかいに合わせる） */
  .gk-green{color:#7fd48a;font-weight:700;}
  .gk-red{color:#f08a84;font-weight:700;}
  .gk-purple{color:#c4a6ff;font-weight:700;}
  .gk-white{color:var(--text);font-weight:700;}
  .gk-remas{color:#d6cfee;font-weight:700;}
  .gk-fc{color:#7fd48a;}
  .gk-sss{color:#f2cf5b;}
  .gk-ap{color:#f4b76a;}
  .gk-fdx{color:#f4b76a;}
  .gk-clear{color:var(--danger);}
  .gk-emph{color:var(--danger);font-weight:700;}
  .gk-nw{white-space:nowrap;}
  .ge-strong,.gf-val{white-space:nowrap;}

  @media (max-width:520px){
    .gc-row, .guide-cond-frame .gc-row{grid-template-columns:1fr;gap:4px;}

  .nav-spacer{flex:1;}
  .header-spacer{flex:1;}
  .header-quiet{background:transparent;border:1px solid var(--border);color:var(--text-dim);
    font-size:11.5px;padding:6px 12px;border-radius:7px;opacity:.7;flex:none;}
  .header-quiet:hover{opacity:1;color:var(--text);border-color:var(--accent);}
  .nav-quiet{background:transparent;border:none;color:var(--text-dim);font-size:11.5px;
    padding:8px 10px;opacity:.6;border-bottom:2px solid transparent;}
  .nav-quiet:hover{opacity:1;color:var(--text);}

  .footer-link{background:none;border:none;color:var(--text-dim);font-size:11px;text-decoration:underline;

  /* ---- section nav ---- */

  /* ---- tier table ---- */
  .tier-row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);}
  .tier-rank-cell{flex:none;width:70px;border-left:4px solid var(--border);padding-left:10px;}
  .tier-rank-label{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.2;}

  .ptier-band-label{font-family:var(--font-display);font-weight:800;font-size:20px;}
  .ptier-doc-title{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--text);}
  .ptier-band-meta{font-size:11px;color:var(--text-dim);}
  .ptier-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:6px 10px;margin-bottom:6px;}
  .ptier-badge-thumb{width:100px;height:auto;border-radius:6px;overflow:hidden;border:1px solid var(--border);

  .ptier-badge-thumb img{width:100%;height:auto;display:block;}
  .ptier-name{flex:1;min-width:0;font-size:13px;word-break:break-word;}
  .ptier-count{font-size:11px;color:var(--text-dim);flex:none;}
  .ptier-points{font-family:var(--font-display);font-weight:700;color:var(--accent);flex:none;font-size:13px;}

  /* 左右差の表示。タイトルに重ならないよう、製作者と同じ行の左端に置く */
  .ptier-meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;}
  .lr-corner-badge{font-size:11.5px;font-weight:700;color:#fdd663;flex:none;
    border:1px solid #fdd663;border-radius:6px;padding:3px 8px;background:rgba(19,20,23,.6);}
  .ptier-meta-row .note{margin:0;}
  /* 完成品：1行3枚、幅いっぱいに使う。枚数が変わっても大きさは同じ */
  .ptier-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;align-items:start;}

  /* 編集画面：1行2枚のまま、少し大きく・間を詰める（密着はさせない） */
  .ptier-edit-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:5px;align-items:start;}
  .ptier-edit-grid .thumb-item{width:auto;}
  .ptier-edit-grid .thumb.plate-thumb{width:100%;}

  /* OFFにしたランクは ON/OFF ボタンだけ残す */
  .level-block.rank-off > *:not(.level-block-head){display:none;}
  .level-block.rank-off .level-block-head > *:not(.onoff-btn){display:none;}

  /* 「このランク」を上、ON/OFF を下の2段に。枠の大きさは変えない */
  .onoff-stacked{flex-direction:column;align-items:center;gap:0;line-height:1.15;}
  .onoff-stacked .onoff-label{margin-right:0;}
  .onoff-switch{display:inline-flex;align-items:center;gap:2px;}

  .ptier-cell{display:flex;flex-direction:column;gap:3px;align-items:center;width:100%;}
  .ptier-cell .ptier-badge-thumb{width:100%;height:auto;}
  .ptier-cell-name{font-size:10px;color:var(--text-dim);text-align:center;word-break:break-word;line-height:1.3;}
  .ptier-badge-thumb.no-img{background:var(--panel-2);}
  .ptier-badge-thumb.no-img .placeholder-text{font-size:10px;color:var(--text-dim);text-align:center;padding:2px;}
  /* ---- 長押しドラッグ ---- */
  .draggable{cursor:grab;touch-action:manipulation;}
  .draggable.is-dragging{opacity:.35;}
  .drag-ghost{position:fixed;z-index:2000;pointer-events:none;opacity:.9;
    transform:translate(-50%,-50%) scale(1.04);box-shadow:0 8px 20px rgba(0,0,0,.55);
    border-radius:8px;margin:0;}
  .drop-hover{outline:2px dashed var(--accent);outline-offset:2px;border-radius:8px;}

  .thumb.plate-thumb{height:auto;}
  .thumb.plate-thumb img{width:100%;height:100%;object-fit:fill;display:block;}
  .tier-total-table{display:flex;flex-direction:column;gap:4px;}
  .tier-total-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:7px;padding:7px 12px;font-size:12.5px;}
  .tt-rank{color:var(--text-dim);font-family:var(--font-display);font-weight:700;width:34px;flex:none;}
  .tt-name{flex:1;min-width:0;word-break:break-word;}
  .tt-count{color:var(--text-dim);font-size:11px;flex:none;}
  .tt-points{font-family:var(--font-display);font-weight:700;color:var(--accent);flex:none;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .modal-box{background:var(--panel-2);border:1px solid var(--border-ctl);border-radius:12px;padding:20px;max-width:380px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .modal-box p{margin:0 0 16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}

  .song-picker-search{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
    border-radius:8px;padding:9px 10px;font-size:13.5px;margin-bottom:8px;}
  .song-picker-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:3px;min-height:120px;}
  .song-pick-row{text-align:left;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:8px 10px;font-size:12.5px;}
  .song-pick-row:hover{border-color:var(--accent);}
  .song-pick-row.is-used{opacity:.45;}

  .bulk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .bulk-cell{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px;
    display:flex;flex-direction:column;gap:6px;}
  .bulk-cell.is-done{border-color:var(--ok);}
  .bulk-thumb{width:100%;aspect-ratio:1;border-radius:7px;overflow:hidden;border:1px solid var(--border);}
  .bulk-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .bulk-name{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;
    padding:6px 8px;font-size:11px;line-height:1.35;word-break:break-word;text-align:left;}
  .bulk-name.unassigned{color:var(--text-dim);border-style:dashed;}
  .bulk-name:hover{border-color:var(--accent);}
  .bulk-clear{background:transparent;border:none;color:var(--danger);font-size:10.5px;padding:0;text-align:left;}
  .picker-group-label{font-size:11px;font-weight:700;color:var(--accent);margin:8px 0 2px;padding-left:2px;}
  .thumb-pick-add{width:56px;height:56px;border-radius:8px;border:1px dashed var(--border-strong);background:var(--panel);
    color:var(--text-dim);font-size:9px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;line-height:1.2;}
  .thumb-pick-add:hover{border-color:var(--accent);color:var(--accent);}
  .thumb.no-img{background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .thumb.no-img .placeholder-text{font-size:8.5px;color:var(--text-dim);text-align:center;padding:2px;line-height:1.2;
    word-break:break-word;}
  .song-name-tag{position:absolute;left:0;right:0;bottom:0;background:rgba(10,11,18,.78);color:#fff;font-size:8px;
    padding:1px 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .onoff-btn{display:inline-flex;align-items:center;gap:2px;}
  .onoff-label{color:var(--text);margin-right:3px;}
  .onoff-active{color:var(--ok);font-weight:800;}
  .onoff-slash{color:var(--text);}
  .onoff-idle{color:var(--text);}

  .del-ask{font-weight:700;font-size:15px;margin:0 0 4px;}
  .del-actions{display:flex;gap:10px;justify-content:flex-end;}
  .del-no{background:transparent;border:1px solid var(--text);color:var(--text);}
  .del-yes{background:var(--danger-bg);border-color:var(--danger-bg);color:#fff;}

  /* ---- 画面の一番上・一番下へ移動するボタン（右下） ----
     maimaiDX NET の Top / Bottom を参考にした角丸の三角形。色はサイトの青に合わせる */
  .jump-nav{position:fixed;right:max(12px, env(safe-area-inset-right));
    bottom:calc(16px + env(safe-area-inset-bottom));z-index:900;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    opacity:1;transition:opacity .5s ease;}
  .jump-nav.is-idle{opacity:0;pointer-events:none;}
  .jump-btn{display:block;width:52px;height:46px;padding:0;border:none;background:none;cursor:pointer;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));transition:transform .15s ease;
    -webkit-tap-highlight-color:transparent;}
  .jump-btn:hover{transform:scale(1.06);}
  .jump-btn:active{transform:scale(.94);}
  .jump-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px;}
  .jump-btn svg{display:block;width:100%;height:100%;overflow:visible;}
  .jump-btn text{font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Arial Rounded MT Bold',sans-serif;
    font-weight:800;paint-order:stroke;stroke:#ffffff;stroke-width:3px;stroke-linejoin:round;}
  @media (max-width:480px){ .jump-btn{width:46px;height:41px;} }

  /* ---- DX / ST の印 ----
     「.thumb img」などの枠側の指定に負けると100%に引き伸ばされて
     ジャケットを覆ってしまうので、枠ごとに名指しし、かつ
     スタイルの一番最後に置いて確実に優先させる。 */
  .thumb img.chart-type-mark,
  .pv-thumb img.chart-type-mark,
  .sync-thumb img.chart-type-mark,
  .bulk-thumb img.chart-type-mark,
  img.chart-type-mark{
    position:absolute;right:3%;bottom:4%;
    width:52%;height:auto;
    display:block;pointer-events:none;}
  /* 小さいサムネイルでは少しだけ大きめに出す */
  .sync-thumb img.chart-type-mark{width:60%;}
</style>

<script>
(function(){
  "use strict";

  /* ========================= helpers ========================= */
  function uid(){ return Math.random().toString(36).slice(2,9); }

  function el(tag, attrs, children){
    attrs = attrs || {}; children = children || [];
    var node = document.createElement(tag);
    Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k.indexOf('on') === 0 && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if (v === true) node.setAttribute(k, '');
      else if (v === false || v === null || v === undefined) { /* skip */ }
      else node.setAttribute(k, v);
    });
    children.forEach(function(c){
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  var COLOR_WORDS = {'緑':'#6fdc6f','黄':'#f5e05a','赤':'#ff5c5c','紫':'#b48cff','白':'#f2f4f8','橙':'#ffb84f','桃':'#ff9fd8'};
  function appendColorized(container, text){
    (text || '').split('').forEach(function(ch){
      var span = document.createElement('span');
      span.textContent = ch;
      if (COLOR_WORDS[ch]) span.style.color = COLOR_WORDS[ch];
      container.appendChild(span);
    });
  }

  function shade(hex, amt){
    var c = hex.replace('#','');
    if (c.length === 3) c = c.split('').map(function(ch){ return ch+ch; }).join('');
    var num = parseInt(c, 16) || 0;
    var r = Math.min(255, Math.max(0, (num >> 16) + amt));
    var g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amt));
    var b = Math.min(255, Math.max(0, (num & 0xff) + amt));

  function resizeImageFile(file, maxSize, quality){
    maxSize = maxSize || 120; quality = quality || 0.78;
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(reader.error); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('image load failed')); };
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* 同じフォルダに songs.json があれば全曲データとして読み込む。

     songs.json は「名前つけツール」の『サイト用データを書き出す』で作れます。 */
  function loadSongsJson(){
    fetch('songs.json').then(function(r){
      if (!r.ok) throw new Error('not found');
      return r.json();
    }).then(function(list){
      if (!Array.isArray(list) || !list.length) return;
      /* 1曲につき「スタンダード」「でらっくす」が別エントリで入っている */
      SONG_MASTER_LIST = list.map(function(s){

          name: s.name,
          type: s.type || '',              /* 'ST' or 'DX' */
          level: s.lv || '',               /* MASTER の難易度 */
          lvv: (typeof s.lvv === 'number' ? s.lvv : -1),
          remas: s.rm || '',               /* Re:MASTER の難易度（あれば） */
          remasv: (typeof s.rmv === 'number' ? s.rmv : -1),
          /* 譜面定数。並べ替えに使う。不明な曲は -1 */
          konst: (typeof s.c === 'number' ? s.c : -1),
          remasKonst: (typeof s.rc === 'number' ? s.rc : -1),
          ver: s.ver || '',
          /* 2つのバージョンにまたがる譜面（どちらが先か分からない曲）はここに2つ目が入る */
          ver2: s.ver2 || ''
        };
      });
      SONG_DATA_FULL = true;
      /* 楽曲データが揃った時点で、空なら初期プレート表を組み立てる */
      if (seedVersionsIfEmpty()) renderApp();

    }).catch(function(){ /* 無ければ埋め込みのまま */ });

  var CHART_TYPE_SOURCES = {

  var MAI_HASHA_SONGS = ["ようこそジャパリパークへ","若い力 -SEGA HARD GIRLS MIX-","Future","ヒバナ","妄想感傷代償連盟","結ンデ開イテ羅刹ト骸","マトリョシカ","39","ロキ","いーあるふぁんくらぶ","ZIGG-ZAGG","カゲロウデイズ","だんだん早くなる","からくりピエロ","ワールズエンド・ダンスホール","立ち入り禁止","はやくそれになりたい！","インビジブル","Tell Your World","ナイトメア☆パーティーナイト","ロストワンの号哭","ロミオとシンデレラ","ナイト・オブ・ナイツ","サドマミホリック","最終鬼畜妹フランドール・S","クレイジークレイジーダンサーズ","明星ロケット","緋色のDance","エピクロスの虹はもう見えない","隠然","Bad Apple!! feat.nomico","ってゐ！ ～えいえんてゐVer～","CYBER Sparks","Lost Princess","キミとボクのミライ","Burning Hearts ～炎のANGEL～","Save This World νMIX","Living Universe","檄！帝国華撃団(改)","Crush On You","Sun Dance","In Chaos","Beat Of Mind","City Escape: Act1","Rooftop Run: Act1","花と、雪と、ドラムンベース。","Starlight Disco","Endless World","ジングルベル","QZKago Requiem","Garakuta Doll Play","Blew Moon","the EmpErroR","ガラテアの螺旋","PANDORA PARADOXXX","Alea jacta est!","FFT","Panopticon","雷切-RAIKIRI-","Schwarzschild","Fragrance","AMAZING MIGHTYYYY!!!!","Danza zandA"];

  var SONG_IMAGE_DIR = 'songs/';
  var IMAGE_EXT = '.png';

  /* Windowsのファイル名に使えない文字は保存時に「_」へ置き換えられている。
     検索・表示は正しい曲名のまま行い、画像を探すときだけ同じ置換をかける。
     使えない文字: \ / : * ? " < > |  （末尾の . と空白も除去される） */
  function toFileName(name){
    if (!name) return '';
    return String(name)
      .replace(/[\\/:*?"<>|]/g, '_')
      .replace(/[. ]+$/, '');

  /* ---- 曲名とファイル名がどうしても噛み合わないものの対応表 ----
     左が正しい曲名、右が songs/ に置いてあるファイル名（.png は不要）。

  var SONG_FILE_OVERRIDES = {
    'False Amber (from the Black Bazaar, Or by A Kervan Trader from the Lands Afar, Or Buried Beneath the Shifting Sands That Lead Everywhere but Nowhere)': 'False Amber',
    'B.B.K.K.B.K.K.': 'B_B_K_K_B_K_K_',

  /* 1つの曲名に対して、ありうるファイル名を優先度順に並べて返す。
     上から順に試し、読み込めたものを使う。 */
  function songFileCandidates(name){
    if (!name) return [];
    var list = [];
    function add(s){ if (s && list.indexOf(s) < 0) list.push(s); }
    if (SONG_FILE_OVERRIDES[name]) add(SONG_FILE_OVERRIDES[name]);
    add(toFileName(name));                                   /* 通常の置換 */
    add(toFileName(name).replace(/\u3000/g, ' '));            /* 全角スペース → 半角 */
    add(toFileName(name).replace(/\./g, '_'));                /* ピリオドも「_」に */
    add(toFileName(name).replace(/\./g, '_').replace(/\u3000/g, ' '));
    add(String(name));                                       /* 置換なしの生の曲名 */
    return list;
  }
  function songImageUrls(name){
    return songFileCandidates(name).map(function(f){
      return SONG_IMAGE_DIR + encodeURIComponent(f) + IMAGE_EXT;
    });
  }
  function getBundledSongImage(name){
    var u = songImageUrls(name);
    return u.length ? u[0] : '';
  }
  /* 優先順位: 開発者が用意した画像 → 各自がアップロードした画像 */
  function resolveSongImage(name){
    return getBundledSongImage(name) || getCachedSongImage(name);
  }

  /* 読み込み失敗時にフォールバックする <img> を作る共通関数。
     candidates を渡すと、綴り違いを順に試してから諦める。 */
  function makeResolvedImg(primarySrc, fallbackDataUrl, onAllFailed, candidates){
    var queue = (candidates || []).slice();
    if (queue.length && queue[0] === primarySrc) queue.shift();
    var img = el('img', {src: primarySrc, alt:''});
    var triedFallback = false;
    img.addEventListener('error', function(){
      if (queue.length){ img.src = queue.shift(); return; }
      if (!triedFallback && fallbackDataUrl && fallbackDataUrl !== primarySrc){
        triedFallback = true;
        img.src = fallbackDataUrl;
        return;
      }
      if (img.parentNode) img.parentNode.removeChild(img);
      if (onAllFailed) onAllFailed();
    });
    return img;
  }
  /* 楽曲ジャケット専用（綴り違いを自動で試す） */
  function makeSongImg(name, primarySrc, fallbackDataUrl, onAllFailed){
    return makeResolvedImg(primarySrc, fallbackDataUrl, onAllFailed, songImageUrls(name));
  }

  /* ---- 曲数からの自動計算（下埋め時間・料金） ---- */
  var COLOR_ORDER = ['緑','黄','赤','紫','白'];
  var SEC_PER_CHART = 204; // 3分24秒（基準タイム）

  function getTierCount(priceRangeText){
    var found = [];
    (priceRangeText || '').split('').forEach(function(ch){
      var idx = COLOR_ORDER.indexOf(ch);
      if (idx >= 0) found.push(idx);
    });
    if (found.length < 1) return null;
    var start = found[0], end = found[found.length - 1];
    return Math.abs(end - start) + 1;
  }

  function roundUpToHundred(n){
    var rem = n % 100;
    return rem === 0 ? n : (n - rem + 100);
  }

  function computeAutoPrice(songCount){
    var p1 = songCount * 3 / 3 * 100;
    var p2raw = songCount * 3 / 4 * 100;
    return { p1: Math.round(p1), p2: roundUpToHundred(Math.round(p2raw)) };
  }

  function computeAutoTime(songCount, tiers){
    if (!tiers) return null;
    var totalSeconds = songCount * tiers * SEC_PER_CHART;
    var wholeMinutes = Math.floor(totalSeconds / 60);
    var remainderSeconds = totalSeconds - wholeMinutes * 60;
    var finalMinutes = wholeMinutes;
    if (remainderSeconds >= 31) finalMinutes += 1;
    var hours = Math.floor(finalMinutes / 60);
    var mins = finalMinutes % 60;
    return hours > 0 ? (hours + '時間' + mins + '分') : (mins + '分');
  }

  function yen(n){ return n.toLocaleString('ja-JP') + '円'; }

  function fmtDate(ts){
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
  }

  /* ---- カスタム確認/通知ダイアログ（window.confirm/alertはプレビュー環境でブロックされる場合があるため使用しない） ---- */

  /* 「<見出し>ON/OFF」の形のボタン。
     いま効いている側を先に出し、緑の太字にする。反対側は白のまま。 */
  function makeOnOffButton(prefix, isOn, onToggle, stacked){
    var btn = el('button', {class:'btn btn-sm onoff-btn' + (stacked ? ' onoff-stacked' : '')});
    function paint(on){
      btn.textContent = '';
      if (prefix) btn.appendChild(el('span', {class:'onoff-label', text: prefix}));
      var sw = el('span', {class:'onoff-switch'});
      sw.appendChild(el('span', {class:'onoff-active', text: on ? 'ON' : 'OFF'}));
      sw.appendChild(el('span', {class:'onoff-slash', text:'/'}));
      sw.appendChild(el('span', {class:'onoff-idle',   text: on ? 'OFF' : 'ON'}));
      btn.appendChild(sw);
    }
    paint(isOn);
    btn.addEventListener('click', function(){
      var next = onToggle();
      paint(next);
    });
    return btn;
  }

  /* 登録曲（Lv.14 / Lv.14+）から選択するピッカー。選択すると onPick(songMasterEntry) が呼ばれる */
  function openSongPicker(onPick, levelFilter, usedNames, opts){
    usedNames = usedNames || {};
    opts = opts || {};

    /* 舞・覇者の表は対象曲が全バージョンにまたがるので、バージョン絞り込みをしない */
    var EXEMPT_VERSION = '舞 ＆ 覇者対象Re:MASTER';
    var docVersion = opts.versionName || '';
    var isExempt = (docVersion.indexOf(EXEMPT_VERSION) >= 0) || (docVersion.indexOf('覇者') >= 0);

    /* 対象となる譜面か
         通常のバージョン : MASTER譜面（スタンダード・でらっくす両方とも対象。
                            両方ある曲は2件として並ぶ）
         舞・覇者        : スタンダードのRe:MASTERを持つもの */
    function hasTargetChart(s){
      if (!SONG_DATA_FULL) return true;          /* 譜面情報がないときは絞らない */
      if (isExempt) return s.type === 'ST' && !!s.remas;
      return true;                                /* 各エントリは元からMASTER譜面 */
    }

    var maiHashaSet = {};
    MAI_HASHA_SONGS.forEach(function(n){ maiHashaSet[n] = true; });

    /* バージョン名から、songs.json 側の表記を割り出す */
    function guessVersion(){
      if (isExempt || !SONG_DATA_FULL) return '';
      var vers = {};
      SONG_MASTER_LIST.forEach(function(s){ if (s.ver) vers[s.ver] = true; if (s.ver2) vers[s.ver2] = true; });
      var names = Object.keys(vers);
      /* 「maimai でらっくす UNiVERSE〈宙ver.〉」→「maimai でらっくす UNiVERSE」 */
      var base = docVersion.split('〈')[0].trim();
      for (var i = 0; i < names.length; i++){
        if (names[i] === base) return names[i];
      }
      return '';
    }

    var backdrop = el('div', {class:'modal-backdrop'});
    var box = el('div', {class:'modal-box', style:{maxWidth:'440px', maxHeight:'82vh', display:'flex', flexDirection:'column'}});
    box.appendChild(el('p', {text:'登録曲から選択', style:{marginBottom:'8px'}}));

    /* バージョン選択（全曲データがあり、例外でないときだけ出す） */
    var verSelect = null;
    if (SONG_DATA_FULL && !isExempt){
      verSelect = el('select', {class:'version-select', style:{marginBottom:'8px'}});
      verSelect.appendChild(el('option', {value:''}, ['すべてのバージョン']));
      var seen = [];
      SONG_MASTER_LIST.forEach(function(s){ if (s.ver && seen.indexOf(s.ver) < 0) seen.push(s.ver); });
      seen.forEach(function(v){
        var left = SONG_MASTER_LIST.filter(function(s){
          return songInVer(s, v) && !usedNames[s.name + '|' + (s.type || '')];
        }).length;
        verSelect.appendChild(el('option', {value: v}, [v + '（残り ' + left + '曲）']));
      });
      var guessed = guessVersion();
      if (guessed) verSelect.value = guessed;
      box.appendChild(verSelect);
    }

    var searchInput = el('input', {type:'text', placeholder:'曲名で検索', class:'song-picker-search'});
    box.appendChild(searchInput);

    var listWrap = el('div', {class:'song-picker-list'});
    box.appendChild(listWrap);

    var closeBtn = el('div', {class:'modal-actions', style:{marginTop:'10px'}});
    closeBtn.appendChild(el('button', {class:'btn btn-ghost', text:'閉じる', onclick: function(){ closeModal(backdrop); }}));
    box.appendChild(closeBtn);

    function renderResults(){
      listWrap.textContent = '';
      var q = searchInput.value.trim().toLowerCase();
      var wantVer = verSelect ? verSelect.value : '';

      var matches = SONG_MASTER_LIST.filter(function(s){
        if (usedNames[s.name + '|' + (s.type || '')]) return false;  /* 登録済みは出さない */
        if (levelFilter && s.level !== levelFilter) return false;
        if (!hasTargetChart(s)) return false;                /* 譜面種別で絞る */
        if (isExempt && SONG_DATA_FULL && !maiHashaSet[s.name]) return false;  /* 舞・覇者の対象曲のみ */
        if (wantVer && !songInVer(s, wantVer)) return false;
        return !q || s.name.toLowerCase().indexOf(q) >= 0;
      });

      /* 譜面定数の高い順。定数が分からない曲は表示レベルで代用する */
      if (SONG_DATA_FULL){
        function sortKey(s){
          var k = isExempt ? s.remasKonst : s.konst;
          if (typeof k === 'number' && k >= 0) return k;
          return isExempt ? (s.remasv || 0) : (s.lvv || 0);
        }
        matches = matches.slice().sort(function(a, b){ return sortKey(b) - sortKey(a); });
      }
      matches = matches.slice(0, 300);

      if (matches.length === 0){
        listWrap.appendChild(el('div', {class:'note', text:'該当する曲がありません'}));
      }
      matches.forEach(function(s){
        var lvText = isExempt ? (s.remas || s.level) : s.level;
        var kon = isExempt ? s.remasKonst : s.konst;
        var label = s.name;
        if (s.type) label += '　' + s.type;
        if (lvText) label += '　[Lv.' + lvText + ']';
        if (typeof kon === 'number' && kon >= 0) label += '　定数 ' + kon.toFixed(1);
        if (s.ver && !wantVer) label += '　' + s.ver + (s.ver2 ? ' ／ ' + s.ver2 : '');
        listWrap.appendChild(el('button', {
          class:'song-pick-row',
          text: label,
          onclick: function(){ closeModal(backdrop); onPick(s); }
        }));
      });

      /* 舞・覇者：曲名が楽曲データと一致しなかったものを知らせる */
      if (isExempt && SONG_DATA_FULL){
        var known = {};
        SONG_MASTER_LIST.forEach(function(s){ known[s.name] = true; });
        var missing = MAI_HASHA_SONGS.filter(function(n){ return !known[n]; });
        if (missing.length){
          listWrap.appendChild(el('div', {class:'note', style:{marginTop:'10px', color:'var(--warn)'},
            text:'照合できなかった曲名（' + missing.length + '件）: ' + missing.join('、')}));
        }
      }
    }
    if (verSelect) verSelect.addEventListener('change', renderResults);
    searchInput.addEventListener('input', renderResults);
    renderResults();

    backdrop.appendChild(box);
    backdrop.addEventListener('click', function(e){ if (e.target === backdrop) closeModal(backdrop); });
    document.body.appendChild(backdrop);
  }

  /* 制覇系プレートのピッカー。categoryで絞り込む（極/将/神/舞舞） */

  /* ---- 読み込んだデータの穴埋め ----
     古い版で保存したデータや、途中で項目が増える前のデータには
     項目そのものが無いことがある。1か所でも undefined があると
     描画の途中で止まり、一覧全体が真っ白になるので、ここで既定値を入れておく。 */
  function normalizeVersion(v){
    if (!v || typeof v !== 'object') return null;
    if (!v.id) v.id = uid();
    v.versionName     = (v.versionName == null) ? '' : String(v.versionName);
    v.priceRange      = (v.priceRange  == null) ? '緑〜赤' : String(v.priceRange);
    v.price1          = (v.price1      == null) ? '' : String(v.price1);
    v.price2          = (v.price2      == null) ? '' : String(v.price2);
    v.timeText        = (v.timeText    == null) ? '' : String(v.timeText);
    v.subtitleText    = (v.subtitleText == null) ? '' : String(v.subtitleText);
    v.timeExclusionNote = (v.timeExclusionNote == null) ? '' : String(v.timeExclusionNote);

      if (existing){ resolve(); return; }
      var s = document.createElement('script');
      s.src = src;
      s.setAttribute('data-src', src);
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error('スクリプトの読み込みに失敗しました: ' + src)); };
      document.head.appendChild(s);
    });
  }

  /* 保存済みの古いデータでも、登録済みJewel（7種）が必ず並ぶように補完する */
  function ensureJewelSlots(doc){
    if (!doc) return doc;
    if (!Array.isArray(doc.jewels)) doc.jewels = [];
    JEWEL_STONE_DEFS.forEach(function(d){
      var found = null;
      for (var i = 0; i < doc.jewels.length; i++){
        if (doc.jewels[i].stone === d.stone){ found = doc.jewels[i]; break; }
      }
      if (!found){
        doc.jewels.push({
          id: uid(), stone: d.stone,
          label: d.stone + ' Jewel　' + d.ver,
          labelColor: '#f2f4f8',
          imgs: { play:'', ap:'', fdx:'' }
        });
      } else if (!found.imgs){
        found.imgs = { play:'', ap:'', fdx:'' };
      }
    });
    /* 定義順（Diamond→Garnet）に並べ替え */
    var order = {};
    JEWEL_STONE_DEFS.forEach(function(d, i){ order[d.stone] = i; });
    doc.jewels.sort(function(a, b){
      var ao = order[a.stone], bo = order[b.stone];
      return (ao === undefined ? 99 : ao) - (bo === undefined ? 99 : bo);
    });
    return doc;
  }

  /* プレート表のバージョン名 → songs.json 側のバージョン名（複数のことがある） */
  function plateVersionToSongVersions(ver){
    if (!ver) return [];
    /* 「A ＆ B」形式はそれぞれに分ける */

  function buildSeedVersion(opt){
    var v = defaultVersion();
    var isExempt = (opt.ver === '舞 ＆ 覇者対象Re:MASTER');
    v.versionName = opt.label;
    v.subtitleText = '';

    /* そのバージョンの対象楽曲を集める
         通常     : MASTER譜面（ST・DX どちらも対象）
         舞・覇者 : スタンダードのRe:MASTER */
    var maiSet = {};
    MAI_HASHA_SONGS.forEach(function(n){ maiSet[n] = true; });
    /* 「maimai ＆ maimai PLUS」のように2バージョンをまとめた表記に対応する */
    var wantVers = plateVersionToSongVersions(opt.ver);
    var pool = SONG_MASTER_LIST.filter(function(s){
      if (isExempt) return s.type === 'ST' && !!s.remas && maiSet[s.name];
      return wantVers.some(function(v){ return songInVer(s, v); });
    });

    v.levels = SEED_LEVELS.map(function(L){
      var songs = pool.filter(function(s){
        return (isExempt ? s.remas : s.level) === L.label;
      }).sort(function(a, b){
        return a.name.localeCompare(b.name, 'ja');
      }).map(function(s){
        return { id: uid(), name: s.name, img: resolveSongImage(s.name), srcType: s.type || '' };
      });
      return { id: uid(), label: L.label, color: L.color, songs: songs, hidden: false };
    });

    /* そのバージョンの実績プレートを 極→将→神→舞舞 の順で並べる */
    v.badges = sortBadgesByCategory(platesOfVersion(opt.ver).map(function(p){

  /* ---- 長押しでドラッグして並べ替え ----
     スマホは長押し（約400ms）→ドラッグ、PCは左ボタン長押し→ドラッグ。
     onDrop(from, to) には「どのランク・どの列の何番目か」を渡す。 */
  var LONG_PRESS_MS = 400;

  function makeDraggable(node, source, onDrop){
    var timer = null, dragging = false, ghost = null;

    function pointOf(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function start(e){
      var pt = pointOf(e);
      timer = setTimeout(function(){
        dragging = true;
        node.classList.add('is-dragging');
        ghost = node.cloneNode(true);
        ghost.classList.add('drag-ghost');
        var r = node.getBoundingClientRect();
        ghost.style.width = r.width + 'px';
        ghost.style.height = r.height + 'px';
        document.body.appendChild(ghost);
        moveGhost(pt);
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch(err){} }
      }, LONG_PRESS_MS);
    }

    function moveGhost(pt){
      if (!ghost) return;
      ghost.style.left = pt.x + 'px';
      ghost.style.top = pt.y + 'px';
    }

    function move(e){
      if (!dragging){
        /* 長押し成立前に動いたらキャンセル */
        if (timer){ clearTimeout(timer); timer = null; }
        return;
      }
      e.preventDefault();
      var pt = pointOf(e);
      moveGhost(pt);
      highlight(pt);
    }

    function targetAt(pt){
      if (ghost) ghost.style.display = 'none';
      var elAt = document.elementFromPoint(pt.x, pt.y);
      if (ghost) ghost.style.display = '';
      while (elAt && !elAt.__dropInfo) elAt = elAt.parentNode;
      return elAt;
    }

    function highlight(pt){
      var all = document.querySelectorAll('.drop-hover');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('drop-hover');
      var t = targetAt(pt);
      if (t && t !== node) t.classList.add('drop-hover');
    }

    function end(e){
      if (timer){ clearTimeout(timer); timer = null; }
      if (!dragging) return;
      dragging = false;
      node.classList.remove('is-dragging');

      var pt = (e.changedTouches && e.changedTouches[0])
        ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY }
        : { x: e.clientX, y: e.clientY };
      var t = targetAt(pt);

      if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      ghost = null;
      var all = document.querySelectorAll('.drop-hover');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('drop-hover');

      if (t && t.__dropInfo && t !== node) onDrop(source, t.__dropInfo);
    }

    node.addEventListener('touchstart', start, { passive: true });
    node.addEventListener('touchmove', move, { passive: false });
    node.addEventListener('touchend', end);
    node.addEventListener('touchcancel', end);

    node.addEventListener('mousedown', function(e){
      if (e.button !== 0) return;
      if (e.target.tagName === 'BUTTON') return;
      start(e);
      function mm(ev){ move(ev); }
      function mu(ev){
        document.removeEventListener('mousemove', mm);
        document.removeEventListener('mouseup', mu);
        end(ev);
      }
      document.addEventListener('mousemove', mm);
      document.addEventListener('mouseup', mu);
    });
  }

  /* プレート種別ごとの一覧バーの色 */
  /* バージョン選択の一覧（舞・覇者は別枠なので除外）。表示例: maimai でらっくす UNiVERSE〈宙ver.〉 */
  function versionTemplateLabel(ver, pre){
    return ver + '〈' + pre + 'ver.〉';
  }
  function versionOptions(){
    var seen = [], out = [];
    PLATE_MASTER_LIST.forEach(function(p){
      if (seen.indexOf(p.ver) >= 0) return;
      seen.push(p.ver);
      /* 舞・覇者はバージョン名の形式が違うのでそのまま出す */
      var label = (p.ver === '舞 ＆ 覇者対象Re:MASTER')
        ? p.ver
        : versionTemplateLabel(p.ver, p.pre);
      out.push({ ver: p.ver, pre: p.pre, label: label });
    });
    return out;
  }
  function platesOfVersion(ver){
    return PLATE_MASTER_LIST.filter(function(p){ return p.ver === ver; });
  }
  /* 極→将→神→舞舞 の順に並べ替える */
  function sortBadgesByCategory(badges){
    var order = { '極':0, '将':1, '神':2, '舞舞':3 };
    function catOf(name){
      for (var i = 0; i < PLATE_MASTER_LIST.length; i++){
        if (PLATE_MASTER_LIST[i].name === name) return PLATE_MASTER_LIST[i].cat;
      }
      return '';
    }
    return badges.slice().sort(function(a, b){
      var ao = order[catOf(a.name)], bo = order[catOf(b.name)];
      if (ao === undefined) ao = 99;
      if (bo === undefined) bo = 99;
      return ao - bo;
    });
  }

  /* Jewel表の一覧バー：宝石らしい鮮やかな虹 */
  var JEWEL_BAR_GRADIENT = 'linear-gradient(90deg,#e8455f,#f0862a,#f5d02e,#3fc46a,#2aa8e0,#5b57d6,#b446c8)';

  function plateCategorySwatch(cat){
    if (cat === '極') return '#4fc3f7';                                   /* 水色 */
    if (cat === '将') return '#c2185b';                                   /* 赤紫 */
    if (cat === '神') return '#e8c24a';                                   /* 金寄りの黄 */
    if (cat === '舞舞') return 'linear-gradient(90deg,#f2b8c6,#f6d9b0,#f2eeb3,#bfe3c6,#b8d8ee,#cfc2e8,#eebfd6)';  /* 淡い虹 */
    return '#7ee787';
  }

  function findPlateTier(id){
    return allPlateTiers.filter(function(t){ return t.id === id; })[0] || null;
  }

  /* ---- 表示順：バージョン実装順 → 舞・覇者 → 実績フレーム表 ---- */
  function versionOrderIndex(v){
    if (v.docType === 'jewel') return 100000;              /* 常に最後 */
    var badges = v.badges || [];
    for (var i = 0; i < badges.length; i++){
      var nm = badges[i].name;
      if (!nm) continue;
      for (var k = 0; k < PLATE_MASTER_LIST.length; k++){
        if (PLATE_MASTER_LIST[k].name === nm){
          var ver = PLATE_MASTER_LIST[k].ver;
          if (ver === '舞 ＆ 覇者対象Re:MASTER'){
            /* 舞・覇者は2種類ある。
               「Re:MASTER（上位）」→ 実績フレーム表の2つ前
               「下位」            → 実績フレーム表の1つ前
               タイトルや補足説明に「下位」「以下」が含まれていれば下位と判定する。 */
            var hint = (v.versionName || '') + ' ' + (v.subtitleText || '');
            var isLower = (hint.indexOf('下位') >= 0) || (hint.indexOf('以下') >= 0);
            return isLower ? 99500 : 99000;
          }
          /* PLATE_MASTER_LIST は実装順に並んでいるので、その出現位置を順序に使う */
          for (var n = 0; n < PLATE_MASTER_LIST.length; n++){
            if (PLATE_MASTER_LIST[n].ver === ver) return n;
          }
        }
      }
    }
    return 98000;   /* プレート未配置のものは舞・覇者の手前 */
  }

  function sortedVersions(){
    return allVersions.slice().sort(function(a, b){
      var d = versionOrderIndex(a) - versionOrderIndex(b);
      if (d !== 0) return d;
      return (a.updatedAt || 0) - (b.updatedAt || 0);
    });
  }

  function findVersion(id){
    return allVersions.filter(function(v){ return v.id === id; })[0] || null;
  }

  function saveDraft(){
    if (!draft.versionName || !draft.versionName.trim()){
      showAlert('バージョン名を入力してください。');

    allVersions.forEach(function(v,i){ if (v.id === draft.id) idx = i; });
    if (idx >= 0) allVersions[idx] = draft; else allVersions.push(draft);
    persistVersions();
    syncWriteVersion(draft);
    goDetail(draft.id);
  }

      syncDeleteVersion(id);

  /* ---- 難易度表ナビゲーション ---- */
  /* 投稿用のプレート難易度表を作成する（カテゴリと左右差を選んでから編集画面へ） */


  /* ---- 難易度表の集計（プレート難易度順） ---- */

  /* ---- プレートのバッジ画像キャッシュ（プレート名ごと。ユーザーがアップロードした画像をこの端末内で記憶） ---- */
  var PLATE_BADGE_CACHE_KEY = 'mmplate_plate_badge_cache_v1';
  function loadPlateBadgeCache(){
    if (!storageOK) return {};
    try{ var raw = localStorage.getItem(PLATE_BADGE_CACHE_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
  }
  var plateBadgeCache = loadPlateBadgeCache();
  function persistPlateBadgeCache(){
    if (!storageOK) return;
    try{ localStorage.setItem(PLATE_BADGE_CACHE_KEY, JSON.stringify(plateBadgeCache)); }catch(e){ /* 容量超過は無視 */ }
  }
  function getCachedPlateBadge(name){ return (name && plateBadgeCache[name]) ? plateBadgeCache[name] : ''; }
  function setCachedPlateBadge(name, dataUrl){ if (!name) return; plateBadgeCache[name] = dataUrl; persistPlateBadgeCache(); }

  /* ---- 開発者があらかじめ用意したプレート画像 ----
     index.html と同じ場所に plates/ フォルダを置き、「プレート名.png」で画像を入れておくと、
     プレート名を選んだ時点で全ての閲覧者にその画像が自動で表示されます。
     例: plates/超極.png, plates/舞舞舞.png
     画像が無い場合はエラーにならず、これまで通り各自のアップロード画像／名前表示にフォールバックします。 */
  var PLATE_IMAGE_DIR = 'plates/';
  var PLATE_IMAGE_EXT = '.png';
  function getBundledPlateImage(name){
    if (!name) return '';
    return PLATE_IMAGE_DIR + encodeURIComponent(toFileName(name)) + PLATE_IMAGE_EXT;
  }
  /* 優先順位: 開発者が用意した画像 → 各自がアップロードした画像 */
  function resolvePlateImage(name){
    return getBundledPlateImage(name) || getCachedPlateBadge(name);
  }
  /* 画像の読み込みに失敗したら、キャッシュ画像→名前表示の順にフォールバックする img を作る */
  function makePlateImg(plateName, fallbackDataUrl, onAllFailed){
    return makeResolvedImg(resolvePlateImage(plateName), fallbackDataUrl, onAllFailed);
  }

  /* ---- 楽曲名から、いずれかの楽曲難易度表での判定ランクを検索（実績プレート表との連携表示に使用） ---- */
